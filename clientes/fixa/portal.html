"variável conforme porte — decisão institucional, não emocional","premium_ceiling":"topo da faixa (R$400.000) aceito quando inclui toda infraestrutura (água, esgoto, drenagem, pavimentação) e relação já estabelecida com a prefeitura (SMU)","elasticity":"baixa — ticket maior é justificado por escopo de obra e não por percepção de marca","pricing_lever":"relacionamento institucional com cartórios e prefeitura, reduzindo prazo e atrito, e execução completa (projeto + obra + jurídico)"}]},"objection_library":{"description":"Objeções reais mapeadas no formulário de kickoff, com respostas construídas a partir do diferencial confirmado da Fixa (engenharia + arquitetura + direito integrados, relacionamento institucional com cartórios e prefeitura).","objections":[{"objection":"Isso não vai ficar muito caro e demorado?","subtext":"Já ouvi histórias de gente que pagou e o processo não saiu do lugar — tenho medo de jogar dinheiro fora.","bad_response":"Não se preocupe, a gente resolve rapidinho.","good_response":"Vou te mostrar exatamente as etapas do seu caso específico e o prazo médio de cada uma, com base nos processos que já concluímos — você vai saber onde o processo está a cada mês.","when_to_use":"Primeira reunião de diagnóstico"},{"objection":"Não sei se realmente preciso disso agora.","subtext":"Não sinto urgência porque não estou tentando vender nem financiar hoje — mas tenho medo de deixar pra quando for tarde.","bad_response":"Você devia regularizar assim que possível.","good_response":"Conta pra mim: você pretende deixar essa casa pros seus filhos? Sem a matrícula regularizada, eles vão ter que resolver isso na Justiça, com advogado, cartório e um processo mais caro do que se resolver agora, em vida.","when_to_use":"Abordagem inicial / qualificação"},{"objection":"Não tenho todos os documentos do imóvel.","subtext":"Acho que sem os papéis certos não tem solução — já desisti antes por causa disso.","bad_response":"Sem documento fica difícil, precisa procurar.","good_response":"Isso é mais comum do que parece — na maioria dos casos a gente consegue reconstituir o histórico do imóvel via cartório, prefeitura e levantamento topográfico. Deixa eu ver seu caso antes de dizer que não dá.","when_to_use":"Primeiro contato / triagem"},{"objection":"Já contratei um escritório antes e não deu em nada.","subtext":"Não confio mais em promessa — quero prova de que vocês são diferentes.","bad_response":"Com a gente vai ser diferente, pode confiar.","good_response":"Entendo a desconfiança. Olha os casos que já concluímos — e antes de fechar, te mostro por escrito cada etapa e prazo do seu processo.","when_to_use":"Objeção recorrente em clientes que já tentaram antes"},{"objection":"Por que contratar vocês e não um concorrente maior/mais conhecido?","subtext":"Aquele é maior/mais famoso — será que vocês dão conta?","bad_response":"Somos tão bons quanto eles.","good_response":"A diferença é que aqui você tem engenharia, arquitetura e direito imobiliário no mesmo escritório — não precisa contratar dois prestadores nem ficar de um lado pro outro. E temos relação direta com o cartório e a prefeitura daqui, o que agiliza o processo.","when_to_use":"Comparação direta com concorrente"},{"objection":"Meu vizinho/família vai discordar da divisão/limite do terreno.","subtext":"Tenho medo de abrir uma briga de família ou com vizinho ao mexer nisso.","bad_response":"Isso é problema jurídico, resolve na Justiça.","good_response":"Antes de qualquer coisa judicial, a gente faz o levantamento técnico que mostra os limites reais — muitas vezes isso já resolve o impasse sem processo, com conversa baseada em dado técnico.","when_to_use":"Casos de usucapião/divisa"},{"objection":"Posso fazer isso sozinho, sem pagar um escritório?","subtext":"Quero economizar, mas não sei se dou conta da burocracia.","bad_response":"Não recomendamos, é arriscado.","good_response":"Dá pra tentar, mas cada etapa (levantamento técnico, processo no cartório, questões jurídicas) tem uma linguagem própria — o que a gente cobra é justamente pra você não precisar aprender tudo isso sozinho nem correr o risco de errar um requisito e voltar pra estaca zero.","when_to_use":"Objeção de preço / DIY"}]},"key_message":{"chosen_message":"Regularize seu imóvel com engenharia, arquitetura e direito num só lugar.","approach":"functional","usage_context":"Site institucional, headline da landing page, bio do Instagram, anúncios de busca (Google Ads)","alternatives":[{"message":"Regularize seu imóvel com engenharia, arquitetura e direito num só lugar.","approach":"functional","rationale":"Escolhida pelo operador. Comunica o diferencial real e verificável da Fixa (três competências integradas num único contrato) — nenhum concorrente mapeado declara oferecer isso, e é uma promessa fácil de sustentar na prática."},{"message":"Deixe a casa da família em ordem, sem preocupação para seus filhos.","approach":"emotional","rationale":"Ativa o medo de deixar conflito de herança, presente nas dores do ICP — mais forte em remarketing e conteúdo de topo de funil do que como mensagem-âncora."},{"message":"Você que resolveu tudo em vida — sem deixar problema para ninguém.","approach":"social","rationale":"Foca em como o cliente quer ser visto pelos filhos/família — mensagem de reforço em depoimentos e prova social, não como mensagem-chave principal."}]},"key_insight":{"headline":"Ivete não está comparando preço — está comparando quem vai realmente entregar dentro do prazo prometido.","context":"Todas as objeções mapeadas no formulário são sobre confiança e prazo (medo de ser enganado, achar que vai demorar demais), não sobre o serviço em si. Os concorrentes mapeados competem em território funcional/credibilidade (Balen com escala institucional, DCA com cases documentados), mas nenhum comunica clareza de prazo como promessa formal.","numbered_reasons":["As objeções do formulário são todas sobre confiança e prazo, não sobre o serviço em si.","Nenhum concorrente mapeado comunica clareza de prazo como diferencial formal — Balen aposta em escala/tradição, DCA em cases.","A Fixa já tem o diferencial real (engenharia+arquitetura+direito integrados, relação com cartórios/prefeitura), mas ainda não formaliza isso como promessa de prazo ao cliente."],"discussion_anchor":"A mensagem funcional escolhida ('tudo num só lugar') só sustenta a promessa se vier acompanhada de um processo comercial que entregue prazo por escrito — isso é decisão de processo comercial, não só de copy, e vale alinhar com o Carlos como parte da Semana 4 (CRM/SDR)."},"pending_validation_items":[{"topic":"Participação da Fixa em novos loteamentos vs. Balen","raised_in_skill":"ee-s1-persona-icp","question":"É possível documentar (contratos, protocolos na prefeitura) que a Fixa assumiu a maioria dos novos loteamentos protocolados na cidade no último ano — mercado que antes era atendido pela Balen — e que a Balen estaria enfrentando problemas de entrega/reputação?","why_it_matters":"Se confirmado e documentável, é um ativo forte de prova social para mensagem, posicionamento (Semana 2) e diagnóstico de mercado. Hoje é só um relato dado na call de kickoff, sem corroboração no formulário — não deve virar claim de marketing ou comparação nominal com a Balen sem essa validação.","render":{"portal":false,"slide":false,"roteiro_apresentacao":true}}]},"ee-s1-swot":{"client_name":"Fixa Engenharia & Assessoria","summary":"A SWOT da Fixa aponta como maior alavanca resolver o técnico e o jurídico da regularização dentro do mesmo processo (diferencial que nenhum concorrente mapeado — Balen, DCA, BLM — comunica) combinado com a ausência de qualquer concorrente formalizando prazo como promessa; a maior proteção necessária é resolver CRM/CRO e unificar a marca antes de escalar mídia paga, para não desperdiçar essa vantagem.","summary_headline":"Fixa resolve engenharia+jurídico da regularização num só processo — diferencial que nenhum concorrente comunica — mas CRM e site zerados ameaçam desperdiçar isso se mídia ligar antes da hora.","summary_highlights":[{"category":"posicao","label":"Balanço SWOT","value":"5 forças / 5 fraquezas","subtext":"5 oportunidades / 5 ameaças — leitura equilibrada, não é pitch de vendas","tone":"blue"},{"category":"competicao","label":"Scorecard digital (0-10)","value":"Fixa 3,4 vs Balen 7,0","subtext":"DCA 5,8, BLM 1,0 — gap maior em site/SEO/mídia paga, não em reputação","tone":"red"},{"category":"oportunidade","label":"Ação #1 priorizada","value":"Vincular GMB ao site — score 9,5/10","subtext":"Custo zero, 15min, payback imediato em visibilidade","tone":"green"},{"category":"risco","label":"Maior ameaça","value":"Ligar mídia antes de CRO/CRM","subtext":"Pode mascarar vazamento de funil como 'anúncio ruim'","tone":"red"},{"category":"janela","label":"Território de mensagem livre","value":"Nenhum concorrente formaliza prazo","subtext":"Balen aposta em escala, DCA em cases — prazo por escrito está livre","tone":"yellow"}],"summary_key_findings":[{"category":"vantagem","text":"A Fixa é a única entre os 3 concorrentes mapeados que resolve o técnico e o jurídico da regularização dentro do mesmo processo, sem o cliente precisar contratar um segundo prestador — Balen tem 3 linhas de negócio, mas ainda separadas por atendimento."},{"category":"ameaca","text":"Balen (Instagram 2.149 seguidores, prêmio Top of Mind 2022, site institucional robusto) e DCA (cases nomeados e indexados no Google, como o Residencial Vista Bella) já têm ativos de escala e prova social que a Fixa ainda não replicou digitalmente."},{"category":"contexto","text":"BLM, o 3º concorrente mapeado no briefing, tem presença digital quase nula (275 curtidas no Facebook, sem site próprio) — não deve ser usada como referência de 'barra mínima' para a Fixa."},{"category":"acao","text":"Antes de investir em mídia paga, a sequência já definida (GMB→site→CRO→CRM) precisa se completar — senão o orçamento de anúncio vai mascarar o vazamento de funil já mapeado como problema de mídia."}],"competitor_scorecard":[{"name":"Fixa Engenharia & Assessoria","type":"cliente","scores":{"site":2.8,"seo":2.2,"midia_paga":0.5,"social":4.8,"gmn":4.5,"reputacao":4.7,"comunicacao":4.5},"evidence":{"site":"Score 28/100 na auditoria de comunicação (ee-s1-auditoria-comunicacao) — sem prova social, CTA genérico, não aparece nos 10 primeiros resultados do Google buscando o próprio nome","seo":"Score 22/100 no diagnóstico de maturidade — GMB é o único sinal positivo; SEO técnico/conteúdo confirmados como baixos pelo operador","midia_paga":"Score 5/100 — zero campanhas ativas confirmadas via conectores V4MOS (Google Ads e Meta Ads zerados no período)","social":"Score 48/100 na auditoria — Instagram @fixa_engenharia com 71 posts e depoimentos reais, mas cobre só a marca Engenharia","gmn":"Score 45/100 — GMB reivindicado, 4,7★, 16 avaliações, mas campo 'website' vazio","reputacao":"Nota 4,7 no GMB com 16 avaliações reais elogiando qualidade/organização/compromisso — volume abaixo do benchmark do setor (50+)","comunicacao":"Coherence_score 45/100 na auditoria — mensagem-chave aprovada ainda não propagada a todos os canais; marca fragmentada entre Engenharia/Assessoria/Jurídico"},"overall":3.4},{"name":"Balen Regularizações","type":"direto","scores":{"site":8,"seo":null,"midia_paga":null,"social":7,"gmn":null,"reputacao":7,"comunicacao":6},"evidence":{"site":"Site institucional (balengroup.com.br/empresa/regularizacoes) com FAQ sobre REURB, cases nomeados (ação judicial vencida, desapropriação), prêmio Top of Mind 2022, 3 linhas de WhatsApp segmentadas por unidade de negócio","seo":"Não verificável nesta rodada — sem ferramenta de ranking disponível; a confirmar em ee-s2-pesquisa-mercado","midia_paga":"Não verificável nesta rodada — sem acesso à Meta Ads Library nesta busca","social":"Instagram @balenregularizacoes com 2.149 seguidores, presença anunciada em 3 cidades (Caxias do Sul, Ponta Grossa, Itaquaquecetuba)","gmn":"Perfil do Google Meu Negócio não localizado/verificado nesta busca","reputacao":"Prêmio 'Top of Mind 2022' em Caxias do Sul, +20 anos de atuação, +20.000 clientes declarados (briefing), cobertura de mídia local citada no próprio site","comunicacao":"Comunica através de 3 sublinhas de negócio (Regularizações, Topografia, Imóveis) já sob uma marca — mensagem gira em 'soluções eficazes', sem foco específico na dor de herança/venda travada do ICP"},"overall":7.0},{"name":"DCA Engenharia","type":"direto","scores":{"site":null,"seo":6,"midia_paga":null,"social":5,"gmn":null,"reputacao":7,"comunicacao":5},"evidence":{"site":"Certificado SSL do site (dca.eng.br) impediu verificação direta nesta rodada","seo":"Múltiplas páginas de projeto indexadas no Google com nome de condomínios reais (Vista Bella, Condado Angel) — SEO de cauda longa por case","midia_paga":"Não verificável nesta rodada","social":"Instagram @dca_engenharia com 1.210 seguidores, 394 posts, bio focada em 'engenharia e meio ambiente', destaques por tema (projetos, incêndio, meio ambiente, REURB)","gmn":"Perfil do Google Meu Negócio não localizado nesta busca","reputacao":"Cases nomeados e documentados publicamente — Residencial Vista Bella (CRF emitido pela Prefeitura em 20/12/2022, 32 unidades regularizadas) e Condomínio Condado Angel (61 matrículas emitidas)","comunicacao":"Posiciona-se como 'assessoria e consultoria em engenharia e meio ambiente' — mais amplo que regularização fundiária pura, sem foco claro em pessoa física com dor de herança/venda travada"},"overall":5.8},{"name":"BLM Assessoria Imobiliária","type":"direto","scores":{"site":0,"seo":1,"midia_paga":null,"social":1,"gmn":null,"reputacao":2,"comunicacao":1},"evidence":{"site":"Sem site próprio confirmado (briefing + busca) — apenas listagens em cadastros empresariais (Solutudo, Econodata, Casa dos Dados)","seo":"Presença só em diretórios de CNPJ — nenhuma página própria otimizada","midia_paga":"Não verificável nesta rodada; presença digital tão fraca que é improvável haver mídia paga ativa","social":"Página no Facebook com 275 curtidas e 56 check-ins — volume muito baixo, sem Instagram identificado nas buscas","gmn":"Perfil do Google Meu Negócio não localizado nesta busca","reputacao":"Nenhuma prova social pública (depoimento, case, prêmio) encontrada nas buscas","comunicacao":"Nenhuma mensagem/proposta de valor pública identificável além do nome e serviço genérico 'assessoria imobiliária'"},"overall":1.0},{"name":"Escritórios de advocacia avulsa (usucapião/inventário)","type":"indireto","scores":{"site":null,"seo":null,"midia_paga":null,"social":null,"gmn":null,"reputacao":null,"comunicacao":null},"evidence":{"geral":"Citado no persona-icp (ee-s1-persona-icp, willingness_to_pay.services[usucapião].elasticity) como concorrência indireta — mais barato que a Fixa, mas sem o levantamento técnico de engenharia. Sem dados observáveis coletados nesta rodada (categoria, não empresa específica)"},"overall":null}],"strengths":[{"title":"Engenharia que resolve a parte jurídica da regularização por dentro, sem precisar de um segundo prestador","description":"A regularização exige levantamento técnico (engenharia/arquitetura) e resolução documental/jurídica (cartório, registro, inventário). A Fixa trata as duas frentes dentro do mesmo processo, com um profissional formado em Direito dedicado à demanda jurídica da própria engenharia — não é um departamento jurídico robusto nem um escritório de advocacia à parte, é a burocracia legal da regularização resolvida junto com o projeto técnico.","implication":"Não comunicar como '3 especialidades separadas e equivalentes' (superpromete capacidade jurídica que a Fixa não tem como escritório robusto). A mensagem correta é funcional: 'você não precisa contratar um engenheiro e depois um advogado, a gente resolve a parte jurídica da regularização junto com o projeto técnico'. Vale alinhar esse ajuste de framing com ee-s2-posicionamento — a mensagem-chave aprovada em ee-s1-persona-icp ('engenharia, arquitetura e direito num só lugar') pode soar como 3 pilares equivalentes se não vier explicada dessa forma.","source":"operador"},{"title":"Depoimentos reais no Instagram — a prova social mais sólida que a Fixa tem hoje","description":"71 posts no Instagram incluem múltiplos depoimentos com nome e foto de cliente, além do GMB reivindicado com nota 4,7. Mas as 16 avaliações do GMB são uma amostra pequena — abaixo do benchmark do setor (50+) para posição competitiva forte no pack local, e uma nota baseada em tão poucas avaliações oscila fácil com 2-3 reviews negativas. Não é um dado robusto ainda, é um ponto de partida.","implication":"Levar os depoimentos do Instagram para o site é o ganho imediato (ação já priorizada); o GMB precisa de volume antes de virar prova social forte de verdade — pedir review sistematicamente a cada processo concluído (já mapeado como fraqueza) é pré-requisito, não só um extra.","source":"diagnostico"},{"title":"Relacionamento institucional consolidado com cartórios e prefeitura (SMU)","description":"O briefing confirma relacionamento direto com cartórios e prefeitura que reduz atrito e prazo — ativo difícil de copiar rapidamente por um novo entrante, e distinto do 'case público' da DCA (que documenta publicamente, mas não necessariamente tem o mesmo grau de relação institucional).","implication":"Usar como argumento de prazo mais confiável (dor #1 do ICP) e formalizar como promessa de prazo por escrito no processo comercial.","source":"briefing"},{"title":"10 anos de histórico (desde 2016) com base de clientes recorrente desde 2018","description":"O briefing confirma 10 anos de atuação da Fixa Engenharia e indica que recompra/indicação já ocorre organicamente, mesmo sem captura estruturada de depoimento.","implication":"Sistematizar a captura de depoimento/indicação pós-processo (hoje não estruturada, ver fraquezas) para transformar histórico em ativo de marketing recorrente.","source":"briefing"},{"title":"Ticket alto e pouco sensível a preço no REURB de loteamentos (R$100-400 mil)","description":"O willingness_to_pay do persona-icp mostra elasticidade baixa nesse serviço — decisão institucional, não emocional, ticket maior justificado por escopo de obra, não por percepção de marca.","implication":"Linha de receita mais resiliente a concorrência de preço — pode sustentar investimento em marketing de marca sem canibalizar margem dos serviços de ticket menor.","source":"diagnostico"}],"weaknesses":[{"title":"Site institucional não aparece nem na busca pelo próprio nome","description":"A auditoria de comunicação confirmou: busca por 'fixa engenharia' não retorna o site nos 10 primeiros resultados do Google; causa-raiz identificada — campo 'website' vazio no GMB.","implication":"Risco de continuar invisível mesmo para quem já conhece a marca; mitigar com o quick win já mapeado (vincular GMB) + SEO local básico.","severity":"critical","source":"diagnostico"},{"title":"CRM inexistente (5/100) — todo lead cai no WhatsApp pessoal do sócio","description":"O diagnóstico de maturidade confirma accesses.crm=false, sem pipeline, sem automação e sem métrica de quantos leads entram por mês.","implication":"Qualquer aumento de volume (orgânico ou pago) vaza sem controle; mitigar com ee-s3-crm-setup antes de escalar mídia paga.","severity":"critical","source":"diagnostico"},{"title":"Marca fragmentada — todos os canais comunicam só 'Fixa Engenharia'","description":"Confirmado nos 3 canais auditados (site, Instagram, GMB) — nenhum menciona a Fixa Assessoria nem a frente jurídica interna, apesar de ser parte do posicionamento que o Carlos quer construir.","implication":"A força de 'resolver técnico e jurídico num só processo' fica incompleta enquanto a marca não for unificada nos canais — resolver no Manual de Marca antes de escalar mídia.","severity":"high","source":"diagnostico"},{"title":"Zero mídia paga e zero rastreamento instalado","description":"Os conectores V4MOS confirmam 0 campanhas em Google Ads e Meta Ads; o briefing confirma accesses.google_analytics=false e google_search_console=false.","implication":"Qualquer decisão de mídia hoje seria 'às cegas' — sem baseline para medir ganho; mitigar instalando tracking junto com a nova LP antes de ligar anúncios.","severity":"high","source":"v4mos"},{"title":"Volume de avaliações do GMB abaixo do benchmark do setor","description":"A auditoria de comunicação identificou o gap: 16 avaliações vs. benchmark de 50+ para posição competitiva forte no pack local.","implication":"Mesmo com nota alta (4,7), o volume baixo limita a força do sinal de confiança; mitigar pedindo review sistemático a cada processo concluído.","severity":"medium","source":"diagnostico"}],"opportunities":[{"title":"Nenhum concorrente mapeado formaliza clareza de prazo como promessa","description":"A pesquisa desta SWOT mostrou: o site da Balen fala em 'soluções eficazes' de forma genérica, a DCA foca em 'engenharia e meio ambiente' amplo — nenhum formaliza 'prazo por escrito' como diferencial, apesar de ser a dor #1 mapeada no ICP (desconfiança sobre prazo).","implication":"Capturar esse território de mensagem antes que um concorrente o ocupe — usar a mensagem-chave já aprovada + processo comercial com prazo por escrito.","time_sensitivity":"urgent","source":"market_trend"},{"title":"BLM tem presença digital quase nula","description":"Confirmado na pesquisa: apenas listagens em diretórios de CNPJ, nenhum domínio institucional, nenhum Instagram identificável, 275 curtidas no Facebook.","implication":"Mesmo com os gaps mapeados na Fixa, é o concorrente mais fácil de superar digitalmente — não deve ser referência de 'barra mínima' ao planejar a Semana 3/4.","time_sensitivity":"medium_term","source":"market_trend"},{"title":"GMB já é ativo real e subaproveitado — quick win de 15 minutos com potencial de destravar SEO local","description":"O campo 'website' vazio explica por que o site não aparece na busca pela própria marca; corrigir isso é imediato e de baixo custo.","implication":"Capturar esse ganho antes mesmo da LP entrar no ar — não depende de nenhuma outra entrega.","time_sensitivity":"urgent","source":"diagnostico"},{"title":"Mercado local sem nenhum concorrente com mídia paga + LP + CRM estruturados","description":"Nenhum dos 3 concorrentes mapeados demonstra estrutura de mídia paga ativa nem funil de conversão dedicado (LP própria) — o público que já pesquisa 'regularizar imóvel Caxias do Sul' hoje se distribui só por indicação/SEO orgânico fraco entre os players.","implication":"Primeiro entrante com mídia paga + LP estruturada + CRM tem janela de CPC/CPA mais baixo antes que Balen ou DCA repliquem.","time_sensitivity":"medium_term","source":"market_trend"},{"title":"Pendência de validação: possível liderança em novos loteamentos frente à Balen","description":"Relato do operador (não confirmado no formulário) registrado em ee-s1-persona-icp como pending_validation_item — se documentável (contratos, protocolos na prefeitura), é prova social/institucional forte contra o maior concorrente.","implication":"Só usar como claim de marketing após validação com contratos/protocolos; por ora, tratar como hipótese a confirmar, não fato.","time_sensitivity":"medium_term","source":"operador"}],"threats":[{"title":"Balen tem escala institucionalizada e reconhecimento de marca formal","description":"A pesquisa confirmou: site institucional robusto, +20 anos de atuação, prêmio Top of Mind 2022, cases publicados (ação judicial vencida, desapropriação), Instagram com 2.149 seguidores.","implication":"A Fixa não vai vencer em escala — precisa competir em especificidade (resolver técnico+jurídico sem 2 prestadores + prazo por escrito), não tentar copiar o modelo de holding da Balen.","probability":"high","impact":"high","source":"market_trend"},{"title":"DCA já pratica SEO de case público — tática replicável e ainda não usada pela Fixa","description":"Páginas indexadas no Google para 'Residencial Vista Bella' e 'Condado Angel', com CRF emitido pela Prefeitura documentado publicamente.","implication":"Se a Fixa não adotar tática semelhante (cases nomeados e indexáveis) no Manual de Marca/site, perde para a DCA no long-tail de busca por nome de empreendimento.","probability":"medium","impact":"medium","source":"market_trend"},{"title":"Mídia paga ligada antes de CRO/CRM mínimos mascara vazamento de funil como 'anúncio ruim'","description":"Já identificado no diagnóstico de maturidade — CRM 5/100 e CRO 8/100 significam que investimento em mídia hoje vazaria antes de gerar retorno mensurável.","implication":"Seguir a sequência já definida (CRO+CRM antes de mídia) para não gerar dado enganoso que leve a abandonar o canal por engano.","probability":"high","impact":"high","source":"diagnostico"},{"title":"Ciclo de decisão curto do ICP (1-3 semanas) amplifica o custo de cada mês sem correção","description":"O buyer_journey do persona-icp mostra ciclo de decisão curto na fase de Pesquisa/Consideração (3-10 dias + 1-3 semanas) — cada mês sem correção é um ciclo inteiro de leads pesquisando e não encontrando a Fixa.","implication":"Priorizar os quick wins (GMB→site) nesta semana, não esperar o pacote completo da Semana 3/4.","probability":"high","impact":"medium","source":"diagnostico"},{"title":"Dependência de uma única pessoa para todo o atendimento comercial","description":"O briefing confirma: sales_module.active_sellers = '0 formal — atendimento comercial feito pelos próprios sócios/técnicos (principalmente Carlos Henrique Garbin)'.","implication":"Gargalo de capacidade se o volume de leads aumentar com mídia paga — endereçar junto com CRM/SDR (Semana 3-5) para não sobrecarregar o Carlos.","probability":"medium","impact":"high","source":"briefing"}],"strategic_synthesis":{"leverage":"A aposta principal é usar a mensagem já aprovada, a prova social existente (mesmo que ainda modesta no GMB) e a relação institucional com cartório/prefeitura para ocupar o território de 'prazo por escrito' que nenhum concorrente comunica hoje — Balen aposta em escala, DCA em cases, e nenhum dos dois formaliza clareza de prazo como promessa, que é exatamente a dor #1 mapeada no ICP. Isso começa pelos quick wins de comunicação (15min a 2h) já identificados na auditoria, antes mesmo da landing page completa entrar no ar.","protection":"O risco principal é que CRM e CRO zerados, combinados com a marca ainda fragmentada em 'só Engenharia', amplifiquem duas ameaças ao mesmo tempo: primeiro, ligar mídia paga cedo demais mascararia vazamento de funil como se fosse problema de anúncio; segundo, enquanto a marca não comunicar a integração técnico+jurídico de forma clara (sem soar como 3 especialidades separadas), a Balen — que já tem 3 linhas de negócio sob uma marca institucionalizada — segue ocupando mais espaço de credibilidade do que a Fixa, mesmo com um diferencial real que a Fixa já tem na prática.","recommended_strategy":"Nos próximos 90 dias, a prioridade é completar a sequência já em andamento — quick wins de comunicação nesta semana, Manual de Marca para unificar a marca, CRO/CRM antes de qualquer mídia paga — reforçada pelo insight desta SWOT: formalizar a promessa de prazo por escrito no processo comercial só depois que o CRM garantir visibilidade de status, para não repetir a mesma desconfiança que a Fixa está tentando resolver."},"tows_matrix":{"description":"Cruzamento dos quadrantes SWOT para derivar estratégias acionáveis — não é redundância da análise, é onde ela vira decisão.","so_strategies":[{"id":"SO1","strategy":"Usar o diferencial de resolver engenharia+jurídico da regularização num só processo (F1, sem comunicar como '3 especialidades separadas') + prova social existente (F2) para ocupar o território de 'clareza de prazo' que nem Balen nem DCA comunicam formalmente (O1).","rationale":"Nenhum concorrente formaliza prazo como promessa; a Fixa já tem os ingredientes (processo integrado + prova social + relação institucional) para sustentar essa promessa com credibilidade.","expected_outcome":"Site/LP/GMB comunicando prazo por escrito como diferencial central, deslocando a comparação de preço para comparação de confiança."},{"id":"SO2","strategy":"Aproveitar a fraqueza digital da BLM (O2) para capturar rapidamente share de busca local, usando o relacionamento institucional (F3) como prova de agilidade nos cases.","rationale":"BLM não compete digitalmente — é o concorrente mais fácil de superar, e a Fixa já tem ativo de relacionamento institucional que a BLM não demonstra publicamente.","expected_outcome":"Fixa ocupa posição de destaque no pack local do Google para termos de regularização antes mesmo de competir diretamente com Balen/DCA."},{"id":"SO3","strategy":"Executar o quick win do GMB (O3) imediatamente, aproveitando a prova social já existente (F2) sem esperar a landing page completa.","rationale":"Ganho de baixo esforço e alto impacto que já está mapeado e pronto para execução.","expected_outcome":"Site passa a aparecer na busca pela própria marca em poucas semanas, recuperando parte do vazamento de 85% identificado na jornada do ICP."}],"wo_strategies":[{"id":"WO1","strategy":"Unificar a marca (resolver W3) no Manual de Marca antes de formalizar a promessa de prazo (capturar O1), garantindo que a integração técnico+jurídico seja comunicada de forma consistente em todos os canais.","rationale":"A oportunidade de ocupar o território de confiança/prazo só funciona se a marca comunicar as frentes de forma coerente — hoje ela não comunica.","expected_outcome":"Site, Instagram e GMB passam a comunicar Engenharia + Assessoria + a parte jurídica interna de forma unificada, sustentando a mensagem-chave sem contradição."},{"id":"WO2","strategy":"Implementar CRM básico (resolver W2) antes de escalar a captação de leads gerada pelos quick wins de SEO local (capturar O3), para não perder o volume adicional no WhatsApp pessoal do Carlos.","rationale":"Mais visibilidade sem CRM só desloca o gargalo — o lead chega e se perde do mesmo jeito.","expected_outcome":"Todo lead adicional gerado pelos quick wins entra em um pipeline mínimo, com visibilidade de volume e status pela primeira vez."},{"id":"WO3","strategy":"Instalar tracking (GA4, pixel — resolver W4) já na correção do GMB/site (capturar O3), para medir desde o primeiro dia o efeito do quick win no vazamento de 85% mapeado na jornada.","rationale":"Sem baseline, não dá para provar que o quick win funcionou nem embasar decisão de investimento futuro em mídia.","expected_outcome":"Primeira medição real de tráfego/conversão da história digital da Fixa, servindo de base para a Semana 4."}],"st_strategies":[{"id":"ST1","strategy":"Usar o fato de resolver o técnico e o jurídico da regularização no mesmo processo (F1) para se posicionar contra a ameaça de escala da Balen (T1) — competir em não precisar de dois prestadores, não em tamanho de escritório.","rationale":"A Fixa não tem orçamento nem estrutura para replicar a holding da Balen; o caminho defensável é ser mais completo por processo, não maior em porte.","expected_outcome":"Mensagem de vendas e site deixam claro 'resolvemos o técnico e o jurídico juntos' como resposta direta à objeção 'por que não um concorrente maior'."},{"id":"ST2","strategy":"Seguir a sequência CRO/CRM antes de mídia (disciplina já definida no diagnóstico) para neutralizar a ameaça de queimar orçamento e concluir erroneamente que mídia não funciona (T3).","rationale":"A ameaça é menos sobre o canal e mais sobre a ordem de execução — proteger o investimento futuro com a sequência certa.","expected_outcome":"Quando a mídia paga ligar (Semana 4), CPA e conversão são mensuráveis desde o primeiro real investido."},{"id":"ST3","strategy":"Formalizar cases nomeados e documentáveis (usando F3 — relacionamento institucional) como resposta à tática de SEO de case da DCA (T2).","rationale":"A DCA já usa cases públicos como ativo de SEO; a Fixa tem histórico de 10 anos e relação institucional para produzir o mesmo tipo de conteúdo, só não formalizou ainda.","expected_outcome":"Páginas de case indexáveis no site, replicando a tática que hoje só a DCA usa no mercado local."}],"wt_strategies":[{"id":"WT1","strategy":"Priorizar os quick wins de comunicação (mitigar W1, W3) nesta semana, não esperar o pacote completo da Semana 3/4, dado o ciclo de decisão curto do ICP (T4).","rationale":"Cada semana de invisibilidade digital custa um ciclo inteiro de leads que decidem em 1-3 semanas — a fraqueza mais barata de corrigir precisa vir primeiro.","expected_outcome":"Vazamento na fase de Pesquisa/Consideração começa a reduzir antes mesmo da LP e do CRM estarem prontos."},{"id":"WT2","strategy":"Endereçar a dependência do Carlos (T5) junto com o CRM básico (mitigar W2), definindo um fluxo mínimo de triagem que não dependa 100% dele.","rationale":"Se o volume de leads aumentar com os quick wins e a mídia futura sem resolver esse gargalo, o próprio sucesso da estratégia sobrecarrega o único vendedor.","expected_outcome":"Triagem inicial (via CRM/SDR na Semana 3-5) reduz a dependência direta do Carlos para os primeiros contatos."},{"id":"WT3","strategy":"Não formalizar a promessa de prazo enquanto o CRM (W2) não garantir visibilidade de status para o cliente durante a execução, evitando reforçar a mesma desconfiança que a Fixa está tentando resolver.","rationale":"Prometer prazo sem conseguir monitorar/comunicar status internamente é pior do que não prometer — alimenta a objeção 'já fui enrolado antes' em vez de neutralizá-la.","expected_outcome":"Promessa de prazo só entra em vigor coordenada com o CRM, protegendo a reputação que a Fixa está construindo digitalmente."}]},"priority_actions":[{"action":"Vincular o site da Fixa ao campo 'website' do perfil do GMB","swot_basis":"Captura O3, mitiga W1, base do SO3","impact":"high","suggested_timeline":"Semana 1 (imediato)","dependencies":[],"financial_impact":{"investment":0,"note":"Custo zero, esforço de 15min — impacto estimado em recuperação parcial do vazamento de 85% na fase de Pesquisa mapeado em ee-s1-auditoria-comunicacao."},"risk_adjusted_score":{"impact":9,"probability_of_success":10,"reversibility":10,"score":9.5}},{"action":"Levar depoimentos do Instagram e avaliações do GMB para o site","swot_basis":"Alavanca F2, captura O3, executa SO3","impact":"high","suggested_timeline":"Semana 1","dependencies":[],"financial_impact":{"investment":0,"note":"Reaproveita material existente; sem custo de produção."},"risk_adjusted_score":{"impact":8,"probability_of_success":9,"reversibility":10,"score":8.7}},{"action":"Instalar GA4 e pixel junto da correção do GMB/site, antes de qualquer teste de mídia paga","swot_basis":"Mitiga W4, executa WO3","impact":"medium","suggested_timeline":"Semana 1-2","dependencies":[],"financial_impact":{"investment":0,"note":"Ferramentas gratuitas — esforço de configuração apenas."},"risk_adjusted_score":{"impact":7,"probability_of_success":9,"reversibility":9,"score":8.3}},{"action":"Implementar CRM básico com pipeline mínimo antes de escalar qualquer geração de leads adicional","swot_basis":"Mitiga W2, executa WO2, WT2","impact":"high","suggested_timeline":"Semana 4 (ee-s3-crm-setup)","dependencies":["ee-s3-crm-setup"],"financial_impact":{"investment":null,"expected_return_90d":null,"note":"Detalhado no diagnóstico de maturidade (priority #1); investimento e retorno específicos ficam em ee-s3-crm-setup."},"risk_adjusted_score":{"impact":9,"probability_of_success":7,"reversibility":8,"score":8.0}},{"action":"Unificar a marca (Engenharia + Assessoria + demanda jurídica interna) no Manual de Marca antes de propagar aos canais","swot_basis":"Mitiga W3, executa WO1, protege contra T1","impact":"high","suggested_timeline":"Semana 4 (ee-s3-manual-marca)","dependencies":["ee-s2-posicionamento"],"financial_impact":{"investment":null,"note":"Custo de produção interno (Executar) — sem investimento externo direto."},"risk_adjusted_score":{"impact":9,"probability_of_success":7,"reversibility":6,"score":7.5}},{"action":"Formalizar promessa de prazo por escrito no processo comercial, coordenada com o CRM","swot_basis":"Executa SO1, WT3 — usa F1+F3, captura O1, evita reforçar T3","impact":"high","suggested_timeline":"Semana 3-4 (junto com ee-s3-crm-setup e ee-s3-is-pipeline)","dependencies":["ee-s3-crm-setup","ee-s3-is-pipeline"],"financial_impact":{"investment":null,"note":"Mudança de processo comercial — sem custo direto de mídia/produção."},"risk_adjusted_score":{"impact":9,"probability_of_success":6,"reversibility":7,"score":7.3}},{"action":"Produzir 1-2 páginas de case nomeado e indexável, aproveitando o histórico de 10 anos","swot_basis":"Executa ST3, usa F3+F4, protege contra T2","impact":"medium","suggested_timeline":"Semana 3-4","dependencies":["ee-s3-manual-marca"],"financial_impact":{"investment":null,"note":"Depende de autorização de clientes para uso de nome/case — mesma pendência já registrada na auditoria de comunicação."},"risk_adjusted_score":{"impact":6,"probability_of_success":6,"reversibility":8,"score":6.5}}],"key_insight":{"headline":"Nenhum concorrente mapeado formaliza clareza de prazo como promessa — e é exatamente essa a dor #1 do ICP da Fixa.","context":"Balen aposta em escala institucional (Top of Mind 2022, holding com 3 unidades de negócio), DCA aposta em cases documentados publicamente — mas nenhum dos dois comunica, como promessa formal, em qual etapa e prazo o processo do cliente está. É exatamente essa a objeção #1 mapeada no ICP: medo de ser 'enrolado' sem saber o prazo real.","numbered_reasons":["(1) A Fixa já resolve o técnico e o jurídico da regularização dentro do mesmo processo, sem precisar de um segundo prestador — diferencial real, mas que só sustenta a promessa de prazo se for comunicado como integração de processo, não como '3 especialidades equivalentes'.","(2) A prova social existe para validar que a Fixa cumpre o que promete (depoimentos reais no Instagram; GMB ainda com amostra pequena, 16 avaliações) — mas precisa ser levada ao site e ter seu volume ampliado antes de sustentar sozinha essa promessa.","(3) O relacionamento institucional com cartórios/prefeitura reduz o risco real de atraso, tornando a promessa de prazo mais segura de cumprir do que para um concorrente sem essa relação."],"discussion_anchor":"Vale alinhar com o Carlos, antes da Semana 2 (posicionamento), como comunicar a parte jurídica sem soar como escritório de advocacia robusto — e decidir se a mensagem-chave já aprovada ('engenharia, arquitetura e direito num só lugar') precisa de um ajuste de explicação para não parecer 3 pilares equivalentes."},"honesty_alert":"A vantagem central da Fixa (resolver técnico+jurídico num só processo) só é real na prática — na percepção pública ainda não existe, porque a marca está fragmentada em todos os canais e a parte jurídica não pode ser comunicada como um departamento robusto (é a demanda jurídica da própria engenharia, tratada internamente). Além disso, o único sinal de prova social hoje fora do Instagram (GMB, 4,7★/16 avaliações) é uma amostra pequena — não deve ser vendido como prova social forte até crescer em volume. E toda a operação comercial depende de uma única pessoa (Carlos); se o volume de leads aumentar com os quick wins e a futura mídia paga, esse gargalo pode neutralizar o ganho da estratégia antes mesmo do CRM/SDR entrarem no ar (Semana 3-5)."},"ee-s2-pesquisa-mercado":{"client_name":"Fixa Engenharia & Assessoria","segment":"Regularização fundiária e imobiliária (engenharia, arquitetura e resolução jurídica documental integradas)","region":"Caxias do Sul, RS e região (Serra Gaúcha)","summary":"A Fixa já captura ~16% de um SAM regional estimado em R$10,6 milhões/ano sem nenhum investimento digital — nível de 'líder de nicho' sustentado só por indicação e relação institucional. O SOM de mercado triangulado (R$2,68 milhões/ano) exige ~58% de crescimento sobre o faturamento atual, alcançável formalizando a promessa de prazo (território que nenhum dos 3 concorrentes mapeados ocupa) e levando a captação para o digital.","summary_headline":"Fixa já captura ~16% do SAM regional (R$10,6M/ano) sem nenhum investimento digital — SOM de mercado (R$2,68M/ano) está ao alcance só formalizando prazo, território livre entre os concorrentes.","summary_highlights":[{"category":"posicao","label":"Share atual do SAM","value":"~16,1%","subtext":"R$1,7M de um SAM regional de R$10,6M/ano — nível de líder de nicho","tone":"blue"},{"category":"oportunidade","label":"SOM de mercado","value":"R$2,68M/ano","subtext":"Triangulado por 3 métodos convergentes — 58% acima do faturamento atual","tone":"green"},{"category":"competicao","label":"Concorrentes diretos mapeados","value":"3 (Balen, DCA, BLM)","subtext":"Balen lidera com 7/10 de maturidade digital; BLM é quase inexistente (1/10)","tone":"yellow"},{"category":"janela","label":"Loteamentos REURB no município","value":"600 áreas irregulares (SMU)","subtext":"466 são REURB-E particulares — nicho de maior ticket da Fixa (R$100-400 mil)","tone":"yellow"},{"category":"risco","label":"Digitalização dos cartórios","value":"Prazo até 25/05/2026 (SERP)","subtext":"IA já lê/organiza matrículas — pode baratear serviço documental simples","tone":"red"}],"summary_key_findings":[{"category":"vantagem","text":"Mesmo sem nenhuma presença digital, a Fixa já captura ~16,1% do SAM regional estimado (R$10,6M/ano) — nível de 'líder de nicho' nos benchmarks de mercado, sustentado só por indicação e relacionamento institucional com cartórios e prefeitura."},{"category":"contexto","text":"O município tem 600 áreas irregulares mapeadas pela própria Secretaria de Urbanismo (SMU, 2021), sendo 466 REURB-E (loteamentos particulares) — é o segmento de maior ticket (R$100-400 mil) e onde o relacionamento institucional da Fixa pesa mais."},{"category":"ameaca","text":"Nenhum concorrente mapeado combina relacionamento institucional forte com presença digital robusta — mas a digitalização nacional dos cartórios (prazo maio/2026, IA já em uso) pode baratear serviços simples de escritura/averbação nos próximos 12-24 meses."},{"category":"acao","text":"O SOM de mercado triangulado (R$2,68M/ano) exige ~58% de crescimento sobre o faturamento atual — alcançável formalizando a promessa de prazo (janela livre já identificada na SWOT) e levando a captação para o digital, sem precisar competir em escala com a Balen."}],"tam_sam_som":{"methodology":"mixed","tam":{"value_brl":1500000000,"description":"Mercado nacional anual de regularização documental residencial e fundiária urbana (escritura/matrícula, usucapião, REURB residencial) — bottom-up a partir do estoque nacional de imóveis sem escritura. Cálculo: 30.000.000 de domicílios urbanos sem escritura (Ministério do Desenvolvimento Regional) × 1%/ano de conversão em contratação de serviço [E] × R$5.000 de ticket médio de regularização residencial (mesmo ticket cobrado pela Fixa hoje, usado como proxy nacional) [E] = R$1,5 bilhão/ano. Não existe relatório setorial dedicado que meça o mercado de 'regularização fundiária' como categoria própria — por isso o bottom-up."},"sam":{"value_brl":10584000,"description":"Mercado regional (Caxias do Sul e Serra Gaúcha) somando dois fluxos: (A) regularização residencial/documental — R$6.384.000/ano, e (B) REURB de loteamentos institucional — R$4.200.000/ano. Ver 'filters' para o detalhamento de cada fluxo.","filters":["Fluxo A (residencial): 463.501 habitantes de Caxias do Sul (IBGE Censo 2022) ÷ 2,54 pessoas/domicílio (média do RS, Censo 2022) ≈ 182.481 domicílios [E] × 50% de taxa de irregularidade documental (proxy nacional, Ministério do Desenvolvimento Regional) ≈ 91.240 domicílios com irregularidade potencial [E] × 1%/ano de conversão em contratação [E] = 912 processos/ano × R$7.000 de ticket médio ponderado (entre regularização de casa R$5k e usucapião R$12k, refletindo o mix real de serviços da Fixa) [E] = R$6.384.000/ano","Fluxo B (loteamentos REURB): 466 loteamentos REURB-E (particulares) mapeados pela Secretaria Municipal de Urbanismo (SMU, 2021) como passivo do município × 6%/ano de taxa de regularização do estoque (ritmo do programa municipal 'Esse Terreno é Meu', ativo desde 2021) [E] ≈ 28 loteamentos/ano × R$150.000 de ticket médio (ponto médio da faixa R$100-400 mil do briefing) = R$4.200.000/ano","Exclui: imóveis já regularizados; municípios fora da Serra Gaúcha; serviços jurídicos avulsos sem componente de engenharia"]},"som":{"value_brl":2680000,"description":"SOM de mercado (teto tangível de captura, não é meta do cliente nem limitado pela capacidade operacional atual) — triangulado por 3 métodos independentes que convergiram na faixa de R$2,1M-R$3,0M/ano, com média de R$2,68M/ano. NÃO foi derivado da meta comercial da Fixa nem reduzido pela capacidade operacional atual (ver operational_ceiling_note). Representa ~25,3% do SAM total e ~39,7% do Mercado Endereçável (R$6.753.600) — essa segunda razão é a leitura mais honesta da performance competitiva da Fixa, porque mede a captura dentro do que ela de fato persegue (perfil médio/médio-alto + loteamentos institucionais), não do SAM inteiro (que inclui perfis que a Fixa filtra deliberadamente, ver anti-persona em ee-s1-persona-icp).","assumptions":["Método 1 (capacidade plenamente madura, bottom-up da estrutura): 1,75× o faturamento atual (R$1,7M) = R$2.975.000/ano — assume maturação operacional mínima (CRM básico funcionando, sem vazamento de lead) com a MESMA equipe, sem contratação adicional","Método 2 (market share top-down, benchmark de nicho): 20% do SAM (R$10.584.000) = R$2.116.800/ano — posiciona a Fixa entre 'líder de nicho' (5-12%) e 'dominante estrutural' (15-25%), justificado pelo relacionamento institucional já consolidado","Método 3 (segmento premium bottom-up): 55% de captura do Fluxo B/loteamentos (R$4.200.000 × 55% = R$2.310.000, dado o relacionamento institucional já estabelecido) + 25% de captura do Fluxo A filtrado por perfil (R$2.553.600 × 25% = R$638.400) = R$2.948.400/ano","Convergência: R$2.116.800 / R$2.948.400 / R$2.975.000 — faixa relativamente estreita, média usada como SOM final"],"operational_ceiling_note":"A estrutura comercial atual (atendimento concentrado no sócio Carlos Henrique Garbin, sem time comercial formal — accesses.crm=false, sales_module.active_sellers='0 formal') sustenta hoje ~R$1,7M/ano. O Método 1 desta triangulação já assume uma maturação operacional mínima (CRM básico) com a mesma equipe. Capturar além do SOM de R$2,68M/ano — por exemplo, para competir por escala com a Balen — exigiria contratação de equipe técnica/comercial adicional, fora do escopo desta pesquisa de mercado."},"sources":[{"name":"Ministério do Desenvolvimento Regional (via Correio Braziliense)","url":"https://www.correiobraziliense.com.br/app/noticia/brasil/2019/07/28/interna-brasil,774183/imoveis-irregulares-no-brasil.shtml","year":2019},{"name":"IBGE - Censo 2022, Panorama Caxias do Sul","url":"https://cidades.ibge.gov.br/brasil/rs/caxias-do-sul/panorama","year":2022},{"name":"CNN Brasil - Média de moradores por domicílio cai no Brasil, Censo 2022 (IBGE)","url":"https://www.cnnbrasil.com.br/nacional/media-de-moradores-por-domicilio-cai-no-brasil-revela-censo-2022/","year":2022},{"name":"Prefeitura de Caxias do Sul - Diretoria de Regularização Fundiária / SMU","url":"https://caxias.rs.gov.br/servicos/urbanismo/diretoria-de-regularizacao-fundiaria","year":2021},{"name":"CBIC - Construção Civil cresce 4,3% em 2024 e impulsiona economia nacional","url":"https://cbic.org.br/construcao-civil-cresce-43-em-2024-e-impulsiona-economia-nacional/","year":2024},{"name":"ANOREG/BR - PID/ONR 2025: inclusão digital nos Cartórios de Imóveis","url":"https://www.anoreg.org.br/site/pid-onr-2025-inclusao-digital-reduz-desigualdades-nos-cartorios-de-imoveis/","year":2025}]},"market_share":{"current_revenue_brl":1700000,"current_share_of_sam_pct":16.1,"target_share_of_sam_pct":25.3,"gap_to_som_brl":980000,"gap_to_som_pct":57.6,"commentary":"A Fixa está hoje em ~16,1% do SAM regional (R$10,6M/ano) — patamar de 'líder de nicho' nos benchmarks de mercado, alcançado inteiramente via indicação e relacionamento institucional, sem qualquer investimento digital (mídia paga: R$0, confirmado via conectores V4MOS). O SOM de R$2,68M/ano representa um crescimento de 57,6% sobre o faturamento atual — não é um salto para outra categoria de empresa, é a mesma vantagem relacional que já existe hoje, só formalizada em processo comercial (prazo por escrito) e levada para o digital (site, LP, mídia paga). Nota sobre metas: o briefing registra '~R$1,7 milhões projetados para 2026' como faturamento (identification.annual_revenue), mas não há um campo de meta comercial explícita e separada documentado ainda (ex: um 'Meta 12M' de formulário V4MOS) — vale levantar isso diretamente com o Carlos em uma próxima call para comparar aspiração dele com o SOM de mercado calculado aqui.","enderecavel_value_brl":6753600,"enderecavel_composition":"Fluxo A (residencial) filtrado a ~40% — perfil de bairro médio/médio-alto que a Fixa atende hoje, conforme anti-persona 'Fora do Padrão de Atendimento' já mapeada em ee-s1-persona-icp: R$6.384.000 × 40% = R$2.553.600 [E]. Mais Fluxo B (REURB de loteamentos) inteiro — decisão institucional, não segmentada por classe social do proprietário individual: R$4.200.000. Total: R$2.553.600 + R$4.200.000 = R$6.753.600.","enderecavel_note":"O SAM total (R$10,6M/ano) inclui todo o backlog de irregularidade documental do município, mas a Fixa filtra deliberadamente o fluxo residencial por perfil de bairro (médio/médio-alto) — o perfil 'Fora do Padrão de Atendimento' já é tratado como anti-persona operacional, não é um gap a corrigir. O Mercado Endereçável (R$6,75M/ano) separa essa barreira de ESCOLHA (SAM → Endereçável) da barreira COMPETITIVA (Endereçável → SOM, onde a Fixa disputa com Balen/DCA/BLM). A razão SOM/Endereçável (~39,7%) é uma leitura mais honesta da performance da Fixa do que SOM/SAM (~25,3%): mostra que, dentro do que ela de fato persegue, já está perto da faixa de 'líder do nicho' (20-40%)."},"competitors":[{"name":"Balen Regularizações","positioning":"Escala e institucionalização sob a marca 'Balen Group' — holding com 3 unidades de negócio (Regularizações, Topografia, Imóveis) já sob uma marca única, +20 anos de atuação, prêmio Top of Mind 2022 em Caxias do Sul, atuação multi-cidade (Caxias do Sul, Ponta Grossa, Itaquaquecetuba).","channels":["Site institucional (SEO)","Instagram (@balenregularizacoes, 2.149 seguidores)","Facebook","LinkedIn","3 linhas de WhatsApp segmentadas por unidade de negócio"],"strengths":["Site institucional robusto com FAQ sobre REURB, cases nomeados (ação judicial vencida, desapropriação municipal) e fundamentação legal explícita","Prêmio 'Top of Mind 2022' e +20 anos de atuação — reconhecimento de marca formal","3 linhas de negócio já unificadas sob uma marca única, modelo que a Fixa ainda está construindo"],"weaknesses":["Mensagem institucional genérica ('soluções eficazes') — não fala diretamente à dor de prazo/confiança do ICP","Nenhuma promessa formal de prazo identificada no site ou material público","Escala de holding pode soar menos pessoal/local do que o atendimento direto que a Fixa oferece"],"estimated_pricing":"[E] Provavelmente comparável ou levemente superior ao ticket da Fixa dado o porte institucional (holding) — nenhuma tabela de preços pública encontrada","digital_score":7,"digital_details":{"website":"balengroup.com.br/empresa/regularizacoes — site institucional robusto, FAQ, cases nomeados, prêmio Top of Mind 2022","instagram":"@balenregularizacoes — 2.149 seguidores, atua em 3 cidades","google":"Não verificado nesta rodada — perfil GMB não localizado na busca","active_ads":"Não verificado nesta rodada — sem acesso à Meta Ads Library"}},{"name":"DCA Engenharia","positioning":"Assessoria e consultoria técnica em engenharia e meio ambiente, com regularização fundiária como uma de suas frentes — posiciona-se por cases públicos e documentados junto à Prefeitura, não por integração jurídica.","channels":["Site (dca.eng.br) com páginas de case individuais indexadas no Google","Instagram (@dca_engenharia, 1.210 seguidores, 394 posts)","Facebook"],"strengths":["SEO de cauda longa forte via páginas de case nomeadas (Residencial Vista Bella — CRF emitido pela Prefeitura em 20/12/2022, 32 unidades regularizadas; Condomínio Condado Angel — 61 matrículas emitidas)","Prova social verificável e específica (nome do empreendimento + resultado documentado publicamente)","Atuação desde 2010 na Serra Gaúcha — histórico consolidado"],"weaknesses":["Posicionamento amplo ('engenharia e meio ambiente') — dilui o foco em regularização fundiária residencial/pessoa física","Sem menção a integração jurídica ou promessa de prazo","Volume de seguidores/engajamento social modesto (1.210) comparado à Balen"],"estimated_pricing":"[E] Provavelmente comparável ao ticket da Fixa dado o foco similar em engenharia + regularização — nenhuma tabela de preços pública encontrada","digital_score":6,"digital_details":{"website":"dca.eng.br — certificado SSL impediu verificação direta nesta rodada; páginas de projeto indexadas no Google confirmam estrutura de cases","instagram":"@dca_engenharia — 1.210 seguidores, 394 posts, destaques por tema (projetos, incêndio, meio ambiente, REURB)","google":"SEO de cauda longa forte via páginas de case nomeadas com resultado documentado (nº de matrículas emitidas)","active_ads":"Não verificado nesta rodada"}},{"name":"BLM Assessoria Imobiliária","positioning":"Assessoria imobiliária genérica, sem proposta de valor digital identificável — presença quase inexistente fora de diretórios de CNPJ.","channels":["Facebook (275 curtidas)"],"strengths":["Nenhum ponto forte digital identificado nesta pesquisa"],"weaknesses":["Sem site próprio confirmado — apenas listagens em diretórios de CNPJ (Solutudo, Econodata, Casa dos Dados)","Sem Instagram identificável nas buscas","Nenhuma prova social pública (depoimento, case, prêmio) encontrada","Nenhuma mensagem/proposta de valor pública além do nome e serviço genérico"],"estimated_pricing":"Não disponível — nenhuma informação de preço encontrada; presença digital insuficiente para estimar","digital_score":1,"digital_details":{"website":"Sem site próprio identificado — apenas listagens em diretórios de CNPJ","instagram":"Não identificado nesta busca","google":"Presença apenas em diretórios de CNPJ, nenhuma página institucional própria","active_ads":"Improvável haver mídia paga ativa dado a ausência de presença digital própria"}}],"competitive_map":{"axis_x":"Boutique relacional (baixa escala, alta proximidade) ↔ Holding institucionalizada (alta escala, processo padronizado)","axis_y":"Presença digital fraca ↔ Presença digital forte","positions":[{"name":"Balen Regularizações","quadrant":"Holding institucionalizada + presença digital forte"},{"name":"DCA Engenharia","quadrant":"Meio-termo — relacional com SEO tático forte (cases nomeados), digital moderado"},{"name":"BLM Assessoria Imobiliária","quadrant":"Boutique relacional + presença digital fraca"},{"name":"Fixa Engenharia & Assessoria","quadrant":"Hoje: boutique relacional + presença digital fraca (mesmo quadrante da BLM, mas com relacionamento institucional muito mais forte). Posição sugerida: mover para 'boutique relacional + presença digital forte' — quadrante vazio."}],"empty_spaces":"Nenhum concorrente combina relacionamento institucional forte (cartórios/prefeitura) com presença digital robusta — é o quadrante vazio que a Fixa pode ocupar, sem precisar copiar a escala de holding da Balen.","crowded_spaces":"Presença digital fraca é o quadrante mais povoado por padrão (BLM e, historicamente, a própria Fixa) — não é onde vale disputar."},"trends":[{"trend":"Digitalização e integração nacional dos registros de imóveis (Sistema Eletrônico dos Registros Públicos — SERP, Lei 14.382/2022), com prazo até 25/05/2026 para os cartórios migrarem 100% dos registros ao sistema digital","evidence":"ANOREG/BR - Programa de Inclusão Digital (PID/ONR 2025); Corregedoria do CNJ prorrogou o prazo de digitalização; 94% dos dados já informatizados; IA 'Iari' (parceria ONR + Google) já em uso para leitura/organização de matrículas"},{"trend":"Mercado imobiliário residencial brasileiro projetado em crescimento para 2026, aumentando a demanda por regularização como pré-requisito de venda/financiamento","evidence":"Mordor Intelligence - Residential Real Estate Market in Brazil; reportagens do setor (imobconecta) apontam crescimento de ~10% projetado para 2026"},{"trend":"Setor de serviços especializados de engenharia (categoria que inclui regularização fundiária/agrimensura) segue em expansão dentro da Construção Civil, que cresceu 4,3% em 2024","evidence":"CBIC - Construção Civil cresce 4,3% em 2024 e impulsiona economia nacional; serviços especializados respondem por 23,9% do resultado do setor; PIB da Construção Civil em R$359,5 bilhões em 2024"}],"threats":[{"threat":"Ferramentas de IA para leitura/organização automática de matrículas (ex: Iari, lançada pelo ONR em parceria com o Google) podem baratear ou tornar mais acessível o autoatendimento em casos simples de escritura/averbação","potential_impact":"Pode comprimir o ticket de serviços documentais simples nos próximos 12-24 meses, pressionando a Fixa a se diferenciar mais pelos casos complexos (usucapião, inventário, REURB de loteamentos) do que pela burocracia documental básica"},{"threat":"Balen Regularizações (concorrente líder, holding institucionalizada com unidades em 3 cidades) pode intensificar presença digital e mídia paga na região","potential_impact":"Fecharia a janela de oportunidade já identificada na SWOT — hoje nenhum concorrente mapeado investe em mídia paga — antes que a Fixa consiga estruturar CRO/CRM/mídia própria (Semana 4 do planejamento)"}],"unexploited_opportunity":{"description":"Ocupar o território 'o escritório que garante prazo por escrito na regularização do seu imóvel' — nenhum dos 3 concor const E = s => s == null ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const N = n => n != null ? new Intl.NumberFormat('pt-BR').format(n) : '—';
const BRL = n => n != null ? 'R$ ' + new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n) : '—';
const PCT = n => n != null ? n.toFixed(1).replace('.',',') + '%' : '—';

function tg(text, color) { return '<span class="tg tg--'+(color||'gray')+'">'+E(text)+'</span>'; }
function mt(val, label, color, tip) {
  const tipLookup = (typeof MT_TIPS !== 'undefined' && MT_TIPS) ? MT_TIPS[label] : null;
  const tipText = tip || tipLookup || '';
  const help = tipText ? '<span class="mt__help" tabindex="0" aria-label="Explicação">?<span class="mt__tip">'+E(tipText)+'</span></span>' : '';
  return '<div class="mt">'+help+'<div class="mt__val'+(color?' mt__val--'+color:'')+'">'+(typeof val==='number'?N(val):E(String(val)))+'</div><div class="mt__lbl">'+E(label)+'</div></div>';
}

function pb(val, color) { return '<div class="pb"><div class="pb__fill pb__fill--'+(color||'red')+'" style="width:'+Math.min(100,Math.max(0,val||0))+'%"></div></div>'; }

function cd(title, body, variant) {
  return '<div class="cd'+(variant?' cd--'+variant:'')+'">'
    +(title?'<div class="cd__title">'+E(title)+'</div>':'')
    +(body?'<div class="cd__body">'+body+'</div>':'')
    +'</div>';
}

function tb(heads, rows) {
  if (!rows || !rows.length) return '';
  return '<div class="tw"><table><thead><tr>'+heads.map(h=>'<th>'+E(h)+'</th>').join('')+'</tr></thead><tbody>'
    +rows.map(r=>'<tr>'+r.map(c=>'<td>'+(c!=null?String(c):'')+' </td>').join('')+'</tr>').join('')
    +'</tbody></table></div>';
}

function chatBubbles(msgs) {
  return '<div class="chat">'+msgs.map(m=>{
    const who = m.from||'sdr';
    return '<div class="chat__msg chat__msg--'+who+'"><div class="chat__who chat__who--'+who+'">'
      +E(m.name||who)+'</div>'+E(m.text)+'</div>';
  }).join('')+'</div>';
}

function checklist(items, statusKey) {
  return '<ul class="cl">'+items.map(it=>{
    const st = statusKey ? (it[statusKey]||'pending') : 'pending';
    const icons = {done:'&#10003;', pending:'&#9675;', blocked:'&#10007;', pass:'&#10003;', fail:'&#10007;', partial:'&#9679;'};
    const cls = {done:'done',pending:'pending',blocked:'blocked',pass:'done',fail:'blocked',partial:'pending'};
    return '<li><span class="cl__icon cl__icon--'+(cls[st]||'pending')+'">'+(icons[st]||'&#9675;')+'</span><span>'
      +(typeof it==='string'?E(it):E(it.item||it.test||it.action||''))+'</span></li>';
  }).join('')+'</ul>';
}

function sc(title, html) { return '<div class="sc"><h3>'+E(title)+'</h3>'+html+'</div>'; }

function renderGantt(actions) {
  if (!actions || !actions.length) return '';
  const maxWeek = Math.max(...actions.map(a => a.week_end || a.week_start || 1), 5);
  const LW = 33;
  const BW = ((100 - LW) / maxWeek).toFixed(2);
  const cols = LW + '% ' + Array(maxWeek).fill(BW + '%').join(' ');
  const IC = {alto:'var(--danger)',alto2:'var(--danger)','médio':'var(--warning)',medio:'var(--warning)',baixo:'#94a3b8'};
  const getColor = imp => IC[(imp||'baixo').toLowerCase().replace(/\u00e9/g,'e')] || '#94a3b8';

  let h = '<div style="margin-top:.25rem">';
  // Header row
  h += '<div style="display:grid;grid-template-columns:'+cols+';gap:2px;margin-bottom:.375rem">';
  h += '<div></div>';
  for (let w = 1; w <= maxWeek; w++) h += '<div style="font-size:.625rem;font-weight:700;text-align:center;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em">S'+w+'</div>';
  h += '</div>';

  // Group by track
  const tracks = [];
  actions.forEach(a => { const t = a.track || 'Geral'; if (!tracks.includes(t)) tracks.push(t); });

  tracks.forEach(track => {
    h += '<div style="font-size:.5625rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);padding:.5rem 0 .25rem;border-top:1px solid var(--border)">'+E(track)+'</div>';
    actions.filter(a => (a.track || 'Geral') === track).forEach(a => {
      const s = Math.max(1, a.week_start || 1);
      const e = Math.min(maxWeek, a.week_end || s);
      const color = getColor(a.impact);
      h += '<div style="display:grid;grid-template-columns:'+cols+';gap:2px;margin-bottom:3px;align-items:center">';
      h += '<div style="font-size:.7rem;color:var(--text-secondary);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding-right:.375rem" title="'+E(a.action)+'">'+E(a.action)+'</div>';
      for (let w = 1; w <= maxWeek; w++) {
        if (w >= s && w <= e) {
          const br = (s===e) ? '3px' : (w===s) ? '3px 0 0 3px' : (w===e) ? '0 3px 3px 0' : '0';
          h += '<div style="height:20px;background:'+color+';border-radius:'+br+';opacity:.82" title="'+E(a.action)+' (S'+s+'–S'+e+')"></div>';
        } else {
          h += '<div style="height:20px;background:var(--surface);border-radius:3px"></div>';
        }
      }
      h += '</div>';
    });
  });

  // Legend
  h += '<div style="display:flex;gap:.75rem;align-items:center;margin-top:.625rem;padding-top:.5rem;border-top:1px solid var(--border)">';
  h += '<span style="font-size:.6875rem;color:var(--text-muted)">Impacto:</span>';
  [['Alto','var(--danger)'],['Médio','var(--warning)'],['Baixo','#94a3b8']].forEach(function(pair) {
    h += '<div style="display:flex;align-items:center;gap:.25rem"><div style="width:10px;height:10px;background:'+pair[1]+';border-radius:2px;opacity:.82"></div><span style="font-size:.6875rem;color:var(--text-secondary)">'+pair[0]+'</span></div>';
  });
  h += '</div>';

  h += '</div>';
  return h;
}

// ===== SVG CHART LIBRARY =====
// Paleta semântica consistente
const CX = {
  red:'#dc2626', danger:'#b91c1c', orange:'#f97316', yellow:'#eab308',
  green:'#16a34a', emerald:'#059669', blue:'#2563eb', purple:'#7c3aed',
  gray:'#94a3b8', muted:'#64748b', line:'#e2e8f0', bg:'#f8fafc', text:'#0f172a'
};
const chartColor = (tone) => CX[tone] || CX.gray;

// insight(): wraps a chart with an auto-insight bullet (leitura estratégica do gráfico)
function insight(chartHtml, insightText, tone) {
  const borderColor = tone==='bad' ? CX.red : tone==='good' ? CX.green : tone==='warn' ? CX.yellow : CX.blue;
  return '<div class="chart-wrap" style="margin-bottom:.75rem">'
    +'<div style="padding:.25rem 0 .5rem">'+chartHtml+'</div>'
    +(insightText ? '<div style="margin-top:.25rem;padding:.5rem .75rem;border-left:3px solid '+borderColor+';background:var(--surface);border-radius:3px;font-size:.75rem;color:var(--text-secondary);line-height:1.45"><strong style="color:'+borderColor+';font-size:.6875rem;text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:.15rem">Leitura</strong>'+E(insightText)+'</div>' : '')
    +'</div>';
}

// chartTitle: subtítulo de gráfico
function chartTitle(t) {
  return '<div style="font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:.375rem">'+E(t)+'</div>';
}

// BAR HORIZONTAL: comparar valores lado a lado
// items: [{label, value, tone, subtext}]
function chartHBar(items, opts) {
  opts = opts || {};
  if (!items?.length) return '';
  const max = opts.max || Math.max(...items.map(i=>i.value||0));
  if (!max) return '';
  const fmt = opts.fmt || (v=>v);
  const lw = opts.labelWidth || 120;
  return (opts.title?chartTitle(opts.title):'')
    +'<div style="display:flex;flex-direction:column;gap:.375rem">'+items.map(it=>{
      const pct = ((it.value||0)/max*100).toFixed(1);
      const col = chartColor(it.tone||'blue');
      return '<div style="display:grid;grid-template-columns:'+lw+'px 1fr 70px;gap:.5rem;align-items:center">'
        +'<div style="font-size:.75rem;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+E(it.label)+'">'+E(it.label)+'</div>'
        +'<div style="height:18px;background:var(--surface);border-radius:3px;overflow:hidden;position:relative">'
        +'<div style="height:100%;width:'+pct+'%;background:'+col+';border-radius:3px;opacity:.85"></div>'
        +(it.subtext?'<div style="position:absolute;top:50%;transform:translateY(-50%);left:8px;font-size:.6875rem;color:white;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.4)">'+E(it.subtext)+'</div>':'')
        +'</div>'
        +'<div style="font-size:.75rem;font-weight:700;color:'+col+';text-align:right">'+E(String(fmt(it.value)))+'</div>'
        +'</div>';
    }).join('')+'</div>';
}

// DONUT: distribuição percentual
// slices: [{label, value, tone}]
function chartDonut(slices, opts) {
  opts = opts || {};
  if (!slices?.length) return '';
  const total = slices.reduce((s,x)=>s+(x.value||0),0);
  if (!total) return '';
  const size = opts.size || 160;
  const cx = size/2, cy = size/2, r = size*0.4, ir = size*0.26;
  let angle = -Math.PI/2;
  const paths = slices.map(s=>{
    const frac = (s.value||0)/total;
    const a2 = angle + frac*Math.PI*2;
    const large = frac > 0.5 ? 1 : 0;
    const x1 = cx+r*Math.cos(angle), y1 = cy+r*Math.sin(angle);
    const x2 = cx+r*Math.cos(a2),   y2 = cy+r*Math.sin(a2);
    const x3 = cx+ir*Math.cos(a2),  y3 = cy+ir*Math.sin(a2);
    const x4 = cx+ir*Math.cos(angle), y4 = cy+ir*Math.sin(angle);
    const d = 'M '+x1+' '+y1+' A '+r+' '+r+' 0 '+large+' 1 '+x2+' '+y2+' L '+x3+' '+y3+' A '+ir+' '+ir+' 0 '+large+' 0 '+x4+' '+y4+' Z';
    angle = a2;
    return '<path d="'+d+'" fill="'+chartColor(s.tone||'blue')+'" opacity=".85"><title>'+E(s.label)+': '+(frac*100).toFixed(1)+'%</title></path>';
  }).join('');
  const legend = slices.map(s=>{
    const pct = ((s.value||0)/total*100).toFixed(1);
    return '<div style="display:flex;align-items:center;gap:.375rem;font-size:.75rem;margin-bottom:.2rem">'
      +'<div style="width:10px;height:10px;background:'+chartColor(s.tone||'blue')+';border-radius:2px;flex-shrink:0"></div>'
      +'<div style="flex:1;color:var(--text-secondary)">'+E(s.label)+'</div>'
      +'<div style="font-weight:700;color:var(--text-primary)">'+pct+'%</div>'
      +'</div>';
  }).join('');
  const centerLabel = opts.center || '';
  return (opts.title?chartTitle(opts.title):'')
    +'<div style="display:grid;grid-template-columns:'+size+'px 1fr;gap:1rem;align-items:center">'
    +'<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'">'+paths
    +(centerLabel?'<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" font-size="14" font-weight="700" fill="'+CX.text+'">'+E(centerLabel.split('|')[0])+'</text>'
      +'<text x="'+cx+'" y="'+(cy+12)+'" text-anchor="middle" font-size="9" fill="'+CX.muted+'" text-transform="uppercase">'+E(centerLabel.split('|')[1]||'')+'</text>':'')
    +'</svg>'
    +'<div>'+legend+'</div>'
    +'</div>';
}

// GAUGE: métrica vs benchmark (semicírculo)
// value: atual, benchmark: meta/média, max: teto da escala
function chartGauge(value, benchmark, max, opts) {
  opts = opts || {};
  if (value == null || max == null) return '';
  const w = opts.size || 220, h = w*0.72;
  const cx = w/2, cy = h*0.78, r = w*0.40;
  const pct = Math.min(1, Math.max(0, value/max));
  const benchPct = benchmark!=null ? Math.min(1, Math.max(0, benchmark/max)) : null;
  // SVG Y-down: ângulo cresce no sentido horário visual.
  // Para gauge superior, vamos de π (LEFT, 9h) até 2π (RIGHT, 3h), passando por 3π/2 (TOP, 12h).
  const angleStart = Math.PI, angleEnd = 2 * Math.PI;
  const valAngle = angleStart + (angleEnd-angleStart)*pct;
  // Inverted logic: for CPL/CPA lower is better
  const invert = opts.invert;
  const isGood = invert ? (benchmark!=null && value <= benchmark) : (benchmark!=null && value >= benchmark);
  const tone = isGood ? 'green' : (benchmark!=null ? 'red' : 'blue');
  const col = chartColor(tone);

  const arcPath = (a1, a2, rad) => {
    const x1 = cx+rad*Math.cos(a1), y1 = cy+rad*Math.sin(a1);
    const x2 = cx+rad*Math.cos(a2), y2 = cy+rad*Math.sin(a2);
    const delta = Math.abs(a2-a1);
    const large = delta >= Math.PI - 0.0001 ? 1 : 0;
    // a2 > a1 = ângulo crescente = horário visual em SVG = sweep=1 (passa pelo TOP indo de LEFT a RIGHT via 3π/2)
    const sweep = a2 > a1 ? 1 : 0;
    return 'M '+x1+' '+y1+' A '+rad+' '+rad+' 0 '+large+' '+sweep+' '+x2+' '+y2;
  };
  const bench = benchPct != null ? angleStart + (angleEnd-angleStart)*benchPct : null;
  const benchX = bench != null ? cx+r*Math.cos(bench) : null;
  const benchY = bench != null ? cy+r*Math.sin(bench) : null;
  const benchXi = bench != null ? cx+(r-10)*Math.cos(bench) : null;
  const benchYi = bench != null ? cy+(r-10)*Math.sin(bench) : null;

  const fmt = opts.fmt || (v=>v);
  return (opts.title?chartTitle(opts.title):'')
    +'<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" style="max-width:'+w+'px">'
    +'<path d="'+arcPath(angleStart, angleEnd, r)+'" fill="none" stroke="'+CX.line+'" stroke-width="10" stroke-linecap="round"/>'
    +'<path d="'+arcPath(angleStart, valAngle, r)+'" fill="none" stroke="'+col+'" stroke-width="10" stroke-linecap="round" opacity=".9"/>'
    +(bench != null ? '<line x1="'+benchXi+'" y1="'+benchYi+'" x2="'+benchX+'" y2="'+benchY+'" stroke="'+CX.text+'" stroke-width="2"/><circle cx="'+benchX+'" cy="'+benchY+'" r="4" fill="'+CX.text+'"/>' : '')
    +'<text x="'+cx+'" y="'+(cy-28)+'" text-anchor="middle" font-size="9" fill="'+CX.muted+'" text-transform="uppercase" letter-spacing=".05em">'+E(opts.metricLabel||'Atual')+'</text>'
    +'<text x="'+cx+'" y="'+(cy-8)+'" text-anchor="middle" font-size="22" font-weight="800" fill="'+col+'">'+E(String(fmt(value)))+'</text>'
    +'<text x="'+(cx-r+4)+'" y="'+(cy+12)+'" text-anchor="start" font-size="8" fill="'+CX.muted+'">0</text>'
    +'<text x="'+(cx+r-4)+'" y="'+(cy+12)+'" text-anchor="end" font-size="8" fill="'+CX.muted+'">'+E(String(fmt(max)))+'</text>'
    +(benchmark != null ? '<text x="'+cx+'" y="'+(cy+28)+'" text-anchor="middle" font-size="10" fill="'+CX.muted+'">Benchmark setor: '+E(String(fmt(benchmark)))+'</text>':'')
    +'</svg>';
}

// FUNNEL: estágios com conversão entre níveis
// stages: [{label, value, tone, subtext}]
function chartFunnel(stages) {
  if (!stages?.length) return '';
  const max = stages[0].value || Math.max(...stages.map(s=>s.value||0));
  if (!max) return '';
  return '<div style="display:flex;flex-direction:column;gap:.25rem">'+stages.map((s,i)=>{
    const pct = ((s.value||0)/max*100);
    const col = chartColor(s.tone||'blue');
    const prev = i>0 ? stages[i-1].value : null;
    const drop = prev && prev > 0 ? (((prev - (s.value||0))/prev)*100).toFixed(0) : null;
    return (drop!==null ? '<div style="text-align:center;font-size:.625rem;color:'+CX.red+';margin:-.1rem 0;font-weight:700">↓ vaza '+drop+'%</div>' : '')
      +'<div style="display:grid;grid-template-columns:140px 1fr 80px;gap:.5rem;align-items:center">'
      +'<div style="font-size:.75rem;font-weight:600;color:var(--text-primary)" title="'+E(s.label)+'">'+E(s.label)+'</div>'
      +'<div style="height:28px;background:var(--surface);border-radius:3px;overflow:hidden;position:relative">'
      +'<div style="height:100%;width:'+pct.toFixed(1)+'%;background:'+col+';border-radius:3px;opacity:.85;min-width:20px"></div>'
      +'<div style="position:absolute;inset:0;display:flex;align-items:center;padding:0 .5rem;font-size:.6875rem;color:'+(pct>40?'white':'var(--text-primary)')+';font-weight:700;text-shadow:'+(pct>40?'0 1px 2px rgba(0,0,0,.4)':'none')+'">'+E(s.subtext||'')+'</div>'
      +'</div>'
      +'<div style="font-size:.8125rem;font-weight:700;text-align:right;color:'+col+'">'+(typeof s.value==='number'?N(s.value):E(String(s.value||'—')))+'</div>'
      +'</div>';
  }).join('')+'</div>';
}
