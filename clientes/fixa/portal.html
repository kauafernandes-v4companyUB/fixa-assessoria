        +   '<span>Apoio · '+esc(pr.support_color)+'</span>'
        +   '<span>Destaque · '+esc(pr.accent_color)+'</span>'
        + '</div>'
        + (pr.rule ? '<p style="font-size:.8125rem;color:var(--text-secondary);margin:.75rem 0 0;line-height:1.5">'+esc(pr.rule)+'</p>' : '');
      h += sc('Proporção 60-30-10', proportionBar);
    }

    if (cs.wcag_contrast_matrix?.length) {
      const lvlColor = { 'AAA':'green', 'AA':'yellow', 'AA Large':'gray', 'Fail':'red' };
      h += sc('Matriz de contraste WCAG · acessibilidade',
        '<div class="gr gr--2">'
        + cs.wcag_contrast_matrix.map(w =>
            '<div style="display:flex;align-items:center;gap:1rem;padding:.75rem;background:var(--bg-elevated);border-radius:var(--radius);border:1px solid var(--border)">'
            + '<div style="display:flex;flex-direction:column;align-items:center;gap:.25rem">'
            +   '<div style="width:64px;height:32px;background:'+safeHex(w.background)+';border:1px solid var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:Fraunces,serif;font-weight:700;font-size:.875rem;color:'+safeHex(w.foreground)+'">Aa</div>'
            +   '<div style="font-size:.625rem;color:var(--text-muted)">'+esc(w.foreground)+' / '+esc(w.background)+'</div>'
            + '</div>'
            + '<div style="flex:1">'
            +   '<div style="font-size:.8125rem;font-weight:600;color:var(--text-primary);margin-bottom:.125rem">'+esc(w.label||'')+'</div>'
            +   '<div style="font-size:.75rem;color:var(--text-muted)">Ratio '+w.ratio+':1 ' + tg(w.level, lvlColor[w.level]||'gray')+'</div>'
            + '</div>'
            + '</div>'
          ).join('')
        + '</div>');
    }
  }

  // Tipografia — VISUALIZADA (escala REAL)
  if (b3.typography) {
    const tp = b3.typography;
    if (tp.primary_family || tp.secondary_family) {
      const fontCard = (f, role, color, fontWeight, fontFamilyFallback) => {
        if (!f) return '';
        const links = [];
        if (f.google_fonts_url) links.push('<a href="'+esc(f.google_fonts_url)+'" target="_blank" rel="noopener" style="color:'+PURPLE+';text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:.25rem"><span style="font-size:.875rem">&#x1F517;</span> Ver no Google Fonts</a>');
        if (f.embed_url) links.push('<details style="display:inline-block;vertical-align:top;margin-left:.5rem"><summary style="cursor:pointer;color:'+TURQ+';font-size:.75rem;font-weight:600">Embed CSS &#8594;</summary><pre style="background:var(--bg-elevated);padding:.5rem;border-radius:4px;font-size:.625rem;line-height:1.4;color:var(--text-secondary);white-space:pre-wrap;word-wrap:break-word;margin-top:.375rem;font-family:ui-monospace,monospace">&lt;link href="'+esc(f.embed_url)+'" rel="stylesheet"&gt;</pre></details>');
        return '<div class="cd'+(role==='primary'?' cd--red':'')+'">'
          + '<div style="font-family:'+f.name+','+fontFamilyFallback+';font-size:3rem;font-weight:'+fontWeight+';line-height:1;color:'+color+';margin-bottom:.5rem">Aa</div>'
          + '<div class="cd__title">'+esc(f.name)+' <span style="color:var(--text-muted);font-weight:400">&middot; '+(role==='primary'?'primária (títulos)':'secundária (corpo)')+'</span></div>'
          + '<div class="cd__body">'+esc(f.source||'')+' &middot; '+(f.weights_permitted||[]).join(', ')+'</div>'
          + (links.length ? '<div style="margin-top:.625rem;font-size:.8125rem">'+links.join('')+'</div>' : '')
          + (f.license ? '<div class="cd__meta">'+esc(f.license)+'</div>' : '')
          + '</div>';
      };
      h += sc('Famílias tipográficas',
        '<div class="gr gr--2">'
        + fontCard(tp.primary_family, 'primary', PURPLE, '700', 'Georgia,serif')
        + fontCard(tp.secondary_family, 'secondary', GRAY, '600', 'sans-serif')
        + '</div>');
    }
    if (tp.hierarchy?.length) {
      h += sc('Hierarquia tipográfica · escala real',
        '<div style="background:#fff;padding:1.5rem;border-radius:var(--radius);border:1px solid var(--border)">'
        + tp.hierarchy.map(lvl => {
            const w = (lvl.weight.match(/\d+/)||['400'])[0];
            const previewSize = Math.min(lvl.size_px, 56);
            return '<div style="display:grid;grid-template-columns:90px 1fr 220px;gap:1.5rem;align-items:baseline;padding:.875rem 0;border-bottom:1px solid var(--border)">'
              + '<div style="font-size:.6875rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700">'+esc(lvl.level)+'</div>'
              + '<div style="font-family:'+lvl.font+',Georgia,serif;font-weight:'+w+';font-size:'+previewSize+'px;line-height:1.2;color:#2E2E33">Seu gato merece</div>'
              + '<div style="font-size:.6875rem;color:var(--text-muted);text-align:right;line-height:1.4">'+esc(lvl.font+' '+lvl.weight)+'<br>'+lvl.size_px+'px / lh '+esc(lvl.line_height||'1.5')+'<br><span style="color:var(--text-muted);font-style:italic">'+esc(lvl.use_case)+'</span></div>'
              + '</div>';
          }).join('')
        + '</div>'
        + (tp.justification ? '<p style="font-size:.8125rem;color:var(--text-secondary);margin:.75rem 0 0;line-height:1.5"><strong>Por quê:</strong> '+esc(tp.justification)+'</p>' : '')
        + (tp.fallbacks ? '<p style="font-size:.75rem;color:var(--text-muted);margin:.5rem 0 0;line-height:1.5"><strong>Fallbacks:</strong> '+esc(tp.fallbacks)+'</p>' : ''));
    }
  }

  // Iconografia — TEXTO PURO (sem ícones desenhados)
  if (b3.iconography) {
    const ic = b3.iconography;
    h += sc('Iconografia · regras de construção',
      '<div class="gr gr--2">'
      + cd('Princípios visuais', esc(ic.style||''))
      + cd('Specs',
          '<div style="font-size:.8125rem;line-height:1.7">'
          + (ic.stroke_weight_px ? '<div><strong>Stroke:</strong> '+ic.stroke_weight_px+'px</div>' : '')
          + (ic.corner_style ? '<div><strong>Cantos:</strong> '+esc(ic.corner_style)+'</div>' : '')
          + (ic.grid ? '<div><strong>Grid:</strong> '+esc(ic.grid)+'</div>' : '')
          + (ic.color_default ? '<div><strong>Cor padrão:</strong> '+esc(ic.color_default)+'</div>' : '')
          + '</div>')
      + '</div>'
      + (ic.do_dont?.length ? '<div class="gr gr--2" style="margin-top:.75rem">'
          + cd('Faça', ic.do_dont.filter(x=>x.type==='do').map(x=>'<div style="margin-bottom:.25rem;color:var(--success);font-size:.8125rem">&#10003; '+esc(x.rule)+'</div>').join(''), 'green')
          + cd('Não faça', ic.do_dont.filter(x=>x.type==='dont').map(x=>'<div style="margin-bottom:.25rem;color:var(--danger);font-size:.8125rem">&#10007; '+esc(x.rule)+'</div>').join(''), 'danger')
          + '</div>' : ''));
  }

  // Fotografia — TEXTO PURO
  if (b3.photography) {
    const ph = b3.photography;
    h += sc('Fotografia · direção de arte',
      (ph.art_direction ? '<p style="font-size:.875rem;color:var(--text-secondary);line-height:1.6;margin-bottom:.75rem">'+esc(ph.art_direction)+'</p>' : '')
      + (ph.mood_keywords?.length ? '<div style="display:flex;flex-wrap:wrap;gap:.375rem;margin-bottom:.75rem">'+ph.mood_keywords.map(m=>'<span class="tg tg--gray" style="font-size:.75rem">'+esc(m)+'</span>').join('')+'</div>' : '')
      + (ph.color_treatment ? '<p style="font-size:.8125rem;color:var(--text-muted);margin-bottom:.5rem"><strong>Tratamento de cor:</strong> '+esc(ph.color_treatment)+'</p>' : '')
      + (ph.stock_rules ? '<p style="font-size:.8125rem;color:var(--text-muted);margin-bottom:.5rem"><strong>Stock:</strong> '+esc(ph.stock_rules)+'</p>' : '')
      + (ph.do_dont?.length ? '<div class="gr gr--2">'
          + cd('Faça', ph.do_dont.filter(x=>x.type==='do').map(x=>'<div style="margin-bottom:.25rem;color:var(--success);font-size:.8125rem">&#10003; '+esc(x.rule)+'</div>').join(''), 'green')
          + cd('Não faça', ph.do_dont.filter(x=>x.type==='dont').map(x=>'<div style="margin-bottom:.25rem;color:var(--danger);font-size:.8125rem">&#10007; '+esc(x.rule)+'</div>').join(''), 'danger')
          + '</div>' : ''));
  }

  if (b3.illustration) {
    const il = b3.illustration;
    h += sc('Ilustração · direção',
      (il.style ? '<p style="font-size:.875rem;line-height:1.6;color:var(--text-secondary);margin-bottom:.5rem">'+esc(il.style)+'</p>' : '')
      + (il.use_cases?.length ? '<div><strong style="font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted)">Casos de uso:</strong><ul style="margin:.25rem 0 0;padding-left:1.25rem;font-size:.8125rem;line-height:1.6;color:var(--text-secondary)">'+il.use_cases.map(u=>'<li>'+esc(u)+'</li>').join('')+'</ul></div>' : ''));
  }

  // ============================================================
  // BLOCO 4 — Aplicações (DOCUMENTACIONAL — sem mockups visuais)
  // ============================================================
  const b4 = d.block4_applications || {};
  h += blockHeader(4, 'Aplicações e Artefatos', 'Specs textuais de cada aplicação para o designer construir os mockups.');

  if (b4.principle) h += co('Princípio: '+b4.principle);

  if (b4.applications?.length) {
    const catLabels = {
      stationery: 'Papelaria',
      digital_ui: 'Digital / UI',
      social_media: 'Redes Sociais',
      sales_marketing: 'Vendas / Marketing',
      signage: 'Sinalização',
      events: 'Eventos'
    };
    const catColors = {
      stationery: PURPLE,
      digital_ui: TURQ,
      social_media: MAGENTA,
      sales_marketing: '#F59E0B',
      signage: GRAY,
      events: PURPLE_DARK
    };
    h += '<div class="gr gr--2" style="grid-auto-rows:auto">'
      + b4.applications.map(app => {
          const catColor = catColors[app.category] || GRAY;
          const catLabel = catLabels[app.category] || app.category;
          return '<div class="cd" style="page-break-inside:avoid">'
            + '<div style="display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.5rem">'
            +   '<div class="cd__title" style="margin:0">'+esc(app.name)+'</div>'
            +   '<span style="background:'+catColor+'15;color:'+catColor+';padding:.125rem .5rem;border-radius:4px;font-size:.625rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;flex-shrink:0">'+esc(catLabel)+'</span>'
            + '</div>'
            + '<div style="background:var(--bg-elevated);padding:.75rem .875rem;border-radius:6px;font-size:.8125rem;line-height:1.6;color:var(--text-secondary);margin-bottom:.5rem"><strong style="color:var(--text-primary);font-size:.6875rem;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:.25rem">Specs técnicas</strong>'+esc(app.specs)+'</div>'
            + (app.mockup?.description ? '<div style="font-size:.75rem;color:var(--text-muted);line-height:1.5;font-style:italic"><strong style="font-style:normal;color:var(--text-primary);font-size:.6875rem;text-transform:uppercase;letter-spacing:.06em;font-style:normal">Mockup pretendido</strong> — '+esc(app.mockup.description)+'</div>' : '')
            + '</div>';
        }).join('')
      + '</div>';
  }

  // ============================================================
  // BLOCO 5 — Governança e Operação
  // ============================================================
  const b5 = d.block5_governance || {};
  h += blockHeader(5, 'Governança e Operação', 'Quem aprova o quê, em quanto tempo, e quando o manual é revisto.');

  if (b5.brand_owner) {
    h += sc('Brand Owner', '<div style="background:linear-gradient(135deg, '+PURPLE+'12, '+TURQ+'08);border-left:4px solid '+PURPLE+';padding:1.25rem 1.5rem;border-radius:0 var(--radius) var(--radius) 0">'
      + '<div style="font-size:.6875rem;letter-spacing:.06em;text-transform:uppercase;color:'+PURPLE+';font-weight:700;margin-bottom:.5rem">Guardião final da marca</div>'
      + '<p style="margin:0;font-size:.9375rem;line-height:1.6;color:var(--text-primary)">'+esc(b5.brand_owner)+'</p>'
      + '</div>');
  }

  if (b5.approval_process?.length) {
    h += sc('Processo de aprovação',
      '<div style="display:flex;align-items:stretch;gap:.75rem;flex-wrap:wrap;margin-top:.5rem">'
      + b5.approval_process.map((s, i) =>
          '<div style="flex:1;min-width:180px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;position:relative">'
          + '<div style="position:absolute;top:-10px;left:1rem;background:'+PURPLE+';color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700">'+(i+1)+'</div>'
          + '<div style="font-size:.875rem;font-weight:600;color:var(--text-primary);margin-top:.25rem;margin-bottom:.375rem">'+esc(s.step)+'</div>'
          + '<div style="font-size:.75rem;color:var(--text-muted);margin-bottom:.25rem">'+esc(s.responsible)+'</div>'
          + (s.estimated_time ? '<div style="font-size:.6875rem;color:'+TURQ+';font-weight:600">&#9201; '+esc(s.estimated_time)+'</div>' : '')
          + '</div>'
        ).join('')
      + '</div>');
  }

  if (b5.review_cadence) h += co('Cadência de revisão: '+b5.review_cadence);

  h += '</div>'; // close mm-content-wrapper
  return h;
},

'ee-s3-landing-page'(d) {
  let h = renderLeituraEstrategica(d, { verdictLabel: 'Veredito da Landing Page' });
  if (d.deploy_url) {
    h += '<div class="sum" style="border-left-color:var(--success)"><div class="sum__tag" style="color:var(--success)">Landing Page Deployada</div>'
      +'<p class="sum__text"><a href="'+E(d.deploy_url)+'" target="_blank" style="font-size:1.125rem">'+E(d.deploy_url)+'</a></p></div>';
  }
  if (d.sections?.length) {
    const names = {hero:'Hero',problem:'Problema',solution:'Solução',how_it_works:'Como Funciona',deliverables:'Entregáveis',final_cta:'CTA Final'};
    h += sc('Seções', d.sections.map(s=>
      cd(names[s.name]||s.name,(s.headline?'<strong>'+E(s.headline)+'</strong><br>':'')+(s.subheadline?E(s.subheadline):''))
    ).join(''));
  }
  if (d.faq?.length) {
    h += sc('FAQ', d.faq.map(f=>cd(f.question,E(f.answer))).join(''));
  }
  if (d.social_proof?.stats?.length) {
    h += sc('Números de Impacto', '<div class="gr gr--'+Math.min(4,d.social_proof.stats.length)+'">'
      +d.social_proof.stats.map(s=>mt(s.number,s.label,'red')).join('')+'</div>');
  }
  return h;
},

'ee-s3-copy-anuncios'(d) {
  const TURQ_LOCAL = '#00B8BD', PURPLE_LOCAL = '#4B1C7D';
  let h = renderLeituraEstrategica(d, { verdictLabel: 'Veredito do Copy' });

  // Bloco didático: como ler este manual
  if (d.how_to_read_this_doc) {
    const guide = d.how_to_read_this_doc;
    let inner = '';
    if (guide.intro) inner += '<p style="margin:0 0 .875rem;line-height:1.55;color:var(--text-secondary);font-size:.875rem">'+E(guide.intro)+'</p>';
    if (guide.structure?.length) {
      inner += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:.625rem;margin:.5rem 0 .875rem">'
        + guide.structure.map(s =>
          '<div style="background:var(--bg-elevated);border:1px solid var(--border);border-left:3px solid '+TURQ_LOCAL+';border-radius:6px;padding:.625rem .75rem">'
          +'<code style="font-size:.6875rem;color:'+TURQ_LOCAL+';font-weight:700">'+E(s.section)+'</code>'
          +'<div style="font-size:.75rem;color:var(--text-primary);margin:.25rem 0;line-height:1.4"><strong>O que é:</strong> '+E(s.what)+'</div>'
          +'<div style="font-size:.6875rem;color:var(--text-muted);line-height:1.45"><strong>Por quê:</strong> '+E(s.why)+'</div>'
          +'</div>'
        ).join('')
        + '</div>';
    }
    if (guide.workflow_recommended?.length) {
      inner += '<div style="font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);margin:.75rem 0 .375rem">Fluxo recomendado</div>'
        + '<ol style="margin:0;padding-left:1.25rem;line-height:1.6;font-size:.8125rem;color:var(--text-secondary)">'
        + guide.workflow_recommended.map(s => '<li>'+E(s.replace(/^\d+\)\s*/,''))+'</li>').join('')
        + '</ol>';
    }
    h += sc(guide.title || 'Como usar este documento', inner);
  }

  if (d.total_variations) {
    const br = d.variations_breakdown || {};
    const meta = br.meta_ads != null ? br.meta_ads : null;
    const goog = br.google_ads_rsa != null ? br.google_ads_rsa : null;
    const googElems = br.google_ads_textual_elements;
    if (meta != null && goog != null) {
      h += '<div class="gr gr--3">'
        + mt(d.total_variations,'Anúncios Prontos','red')
        + mt(meta,'Meta Ads','blue','1 variação = 1 anúncio completo (texto + headline + descrição + CTA).')
        + mt(goog+(googElems?' ('+googElems+' elem.)':''),'Google Ads RSA','blue','1 RSA = 1 anúncio com 5 headlines + 3 descriptions que o Google rotaciona.')
        + '</div>';
    } else {
      h += '<div class="gr gr--2">'+mt(d.total_variations,'Anúncios Prontos','red')+mt((d.funnel_stages||[]).length,'Etapas do Funil','')+'</div>';
    }
  }

  // Lookup de criativos do output ee-s3-criativos-anuncios (cross-skill)
  const allCreatives = {};
  try {
    const cr = (window.PORTAL_DATA && PORTAL_DATA.outputs && PORTAL_DATA.outputs['ee-s3-criativos-anuncios'] && PORTAL_DATA.outputs['ee-s3-criativos-anuncios'].produced_creatives) || {};
    [].concat(cr.feed_instagram||[], cr.stories_instagram||[]).forEach(c => { allCreatives[c.id] = c; });
  } catch(e) {}
  const pairChip = (cid) => {
    const c = allCreatives[cid];
    if (!c) return '<code style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:4px;padding:.125rem .375rem;font-size:.6875rem;color:var(--text-muted)">'+E(cid)+'</code>';
    return '<a href="'+E(c.url)+'" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:.25rem;background:var(--bg-elevated);border:1px solid var(--border);border-radius:4px;padding:.125rem .375rem;font-size:.6875rem;color:'+TURQ_LOCAL+';text-decoration:none;font-weight:600" title="'+E(c.caption_label||'')+'">'
      +'<span style="display:inline-block;width:14px;height:14px;border-radius:2px;background:#FBF4E4 url(\''+E(c.url)+'\') center/cover no-repeat;flex-shrink:0"></span>'
      +'<code>'+E(cid)+'</code>'
      +'</a>';
  };

  if (d.funnel_stages?.length) {
    const fn = {topo_de_funil:'Topo de Funil',meio_de_funil:'Meio de Funil',fundo_de_funil:'Fundo de Funil',remarketing:'Remarketing'};
    const toneByStage = {topo_de_funil:'blue',meio_de_funil:'yellow',fundo_de_funil:'green',remarketing:'red'};
    const stageData = d.funnel_stages.map(s=>{
      const count = (s.platforms||[]).reduce((sum,p)=>sum+(p.variations?.length||0),0);
      return {label: fn[s.name]||s.name, value: count, tone: toneByStage[s.name]||'gray'};
    }).filter(x=>x.value>0);
    if (stageData.length >= 2) {
      const top = [...stageData].sort((a,b)=>b.value-a.value)[0];
      const fund = stageData.find(x=>x.label.includes('Fundo'));
      const distInsight = 'Maior volume em "'+top.label+'" ('+top.value+' variações). '
        +(fund && fund.value < top.value/2 ? 'Atenção: fundo de funil sub-representado — leads quentes podem ficar sem copy dedicada.' : 'Mix coerente entre etapas.');
      h += sc('Distribuição de Copy por Estágio',
        insight(chartDonut(stageData, {title:'Variações por Funil'}),
          distInsight, fund && fund.value < top.value/2 ? 'warn' : 'good'));
    }

    const hookLbl = {dor:'Dor',resultado:'Resultado',curiosidade:'Curiosidade',social_proof:'Prova Social',prova_social:'Prova Social',urgencia:'Urgência',indignacao:'Indignação',reconhecimento:'Reconhecimento',comparacao:'Comparação',transparencia:'Transparência',oferta_direta:'Oferta Direta',facilitacao:'Facilitação',secundaria_caes:'Cães',reconhecimento_continuidade:'Reconhecimento',objecao_estresse:'Objeção'};
    const hookTone = {dor:'danger',prova_social:'green',resultado:'green',oferta_direta:'green',transparencia:'blue',comparacao:'yellow',facilitacao:'blue',reconhecimento:'gray',reconhecimento_continuidade:'gray',indignacao:'danger',objecao_estresse:'yellow',secundaria_caes:'gray',social_proof:'green',curiosidade:'yellow',urgencia:'danger'};

    d.funnel_stages.forEach(stage => {
      const stageName = fn[stage.name] || stage.name;
      let stageInner = '';
      if (stage.objective) stageInner += '<p style="margin:0 0 .375rem;font-size:.8125rem;color:var(--text-secondary);line-height:1.55"><strong style="color:var(--text-primary)">Objetivo:</strong> '+E(stage.objective)+'</p>';
      if (stage.tone) stageInner += '<p style="margin:0 0 .875rem;font-size:.75rem;color:var(--text-muted);line-height:1.5"><strong>Tom:</strong> '+E(stage.tone)+'</p>';

      (stage.platforms||[]).forEach(plat => {
        const platName = plat.name === 'meta_ads' ? 'Meta Ads' : (plat.name === 'google_ads' ? 'Google Ads (RSA)' : plat.name);
        const platColor = plat.name === 'meta_ads' ? TURQ_LOCAL : PURPLE_LOCAL;
        stageInner += '<div style="font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:'+platColor+';margin:.875rem 0 .5rem">'+E(platName)+'</div>';

        (plat.variations||[]).forEach(v => {
          if (plat.name === 'google_ads') {
            stageInner += '<div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:.75rem .875rem;margin-bottom:.5rem">';
            if (v.match_intent) stageInner += '<div style="font-size:.6875rem;color:var(--text-muted);margin-bottom:.5rem;font-style:italic"><strong>Intenção:</strong> '+E(v.match_intent)+'</div>';
            if (v.headlines?.length) {
              stageInner += '<div style="font-size:.6875rem;color:var(--text-muted);font-weight:600;margin:.25rem 0">Headlines (≤30 chars)</div>'
                + '<ul style="margin:0 0 .625rem;padding-left:1rem;font-size:.8125rem;line-height:1.55">'
                + v.headlines.map((hd,i) => '<li>'+E(hd)+' <span style="color:var(--text-muted);font-size:.625rem">('+(v.char_count_headlines?.[i]!=null?v.char_count_headlines[i]:hd.length)+')</span></li>').join('')
                + '</ul>';
            }
            if (v.descriptions?.length) {
              stageInner += '<div style="font-size:.6875rem;color:var(--text-muted);font-weight:600;margin:.25rem 0">Descriptions (≤90 chars)</div>'
                + '<ul style="margin:0;padding-left:1rem;font-size:.8125rem;line-height:1.55">'
                + v.descriptions.map((dx,i) => '<li>'+E(dx)+' <span style="color:var(--text-muted);font-size:.625rem">('+(v.char_count_descriptions?.[i]!=null?v.char_count_descriptions[i]:dx.length)+')</span></li>').join('')
                + '</ul>';
            }
            stageInner += '</div>';
          } else {
            const accent = (v.hook_type==='dor'||v.hook_type==='indignacao') ? 'var(--danger)' : TURQ_LOCAL;
            stageInner += '<div style="background:var(--bg-elevated);border:1px solid var(--border);border-left:3px solid '+accent+';border-radius:6px;padding:.75rem .875rem;margin-bottom:.5rem">'
              + '<div style="display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.5rem">'
                + (v.hook_type ? tg(hookLbl[v.hook_type]||v.hook_type, hookTone[v.hook_type]||'gray') : '')
                + (v.type ? '<code style="font-size:.625rem;color:var(--text-muted)">'+E(v.type)+'</code>' : '')
              + '</div>'
              + (v.text ? '<p style="margin:0 0 .5rem;font-size:.875rem;line-height:1.5;color:var(--text-primary)">'+E(v.text)+'</p>' : '')
              + '<div style="display:flex;flex-wrap:wrap;gap:.875rem;font-size:.75rem;color:var(--text-secondary);margin-bottom:.25rem">'
                + (v.headline ? '<span><strong style="color:var(--text-muted)">Headline:</strong> '+E(v.headline)+'</span>' : '')
                + (v.description ? '<span><strong style="color:var(--text-muted)">Desc:</strong> '+E(v.description)+'</span>' : '')
                + (v.cta ? '<span><strong style="color:var(--text-muted)">CTA:</strong> '+E(v.cta)+'</span>' : '')
              + '</div>'
              + (v.char_count ? '<div style="font-size:.625rem;color:var(--text-muted);margin-top:.25rem">char_count — text: '+(v.char_count.text!=null?v.char_count.text:'?')+' · headline: '+(v.char_count.headline!=null?v.char_count.headline:'?')+' · desc: '+(v.char_count.description!=null?v.char_count.description:'?')+'</div>' : '')
              + (v.pair_with_creative?.length ? '<div style="margin-top:.5rem;display:flex;flex-wrap:wrap;gap:.25rem;align-items:center"><span style="font-size:.625rem;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-right:.25rem">Pareia com:</span>'+v.pair_with_creative.map(pairChip).join('')+'</div>' : '')
              + '</div>';
          }
        });
      });

      h += sc(stageName, stageInner);
    });
  }

  // Limites de caracteres
  if (d.char_limits_reference) {
    const lim = d.char_limits_reference;
    let limInner = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.75rem">';
    if (lim.meta_ads) {
      limInner += '<div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:.75rem .875rem">'
        +'<div style="font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:'+TURQ_LOCAL+';margin-bottom:.5rem">Meta Ads</div>'
        +'<div style="font-size:.8125rem;line-height:1.7;color:var(--text-secondary)">'
          +'<div>Texto: ≤<strong>'+E(lim.meta_ads.primary_text_max)+'</strong> chars</div>'
          +'<div>Headline: ≤<strong>'+E(lim.meta_ads.headline_max)+'</strong> chars</div>'
          +'<div>Descrição: ≤<strong>'+E(lim.meta_ads.description_max)+'</strong> chars</div>'
        +'</div>'
        +(lim.meta_ads.note?'<div style="font-size:.6875rem;color:var(--text-muted);margin-top:.5rem;font-style:italic">'+E(lim.meta_ads.note)+'</div>':'')
      +'</div>';
    }
    if (lim.google_ads) {
      limInner += '<div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:.75rem .875rem">'
        +'<div style="font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:'+PURPLE_LOCAL+';margin-bottom:.5rem">Google Ads (RSA)</div>'
        +'<div style="font-size:.8125rem;line-height:1.7;color:var(--text-secondary)">'
          +'<div>Headline: ≤<strong>'+E(lim.google_ads.headline_max)+'</strong> chars</div>'
          +'<div>Descrição: ≤<strong>'+E(lim.google_ads.description_max)+'</strong> chars</div>'
        +'</div>'
        +(lim.google_ads.note?'<div style="font-size:.6875rem;color:var(--text-muted);margin-top:.5rem;font-style:italic">'+E(lim.google_ads.note)+'</div>':'')
      +'</div>';
    }
    limInner += '</div>';
    h += sc('Limites de Caracteres', limInner);
  }

  // Estratégia de teste
  if (d.test_strategy) {
    const ts = d.test_strategy;
    let tsInner = '<div style="display:flex;flex-wrap:wrap;gap:.75rem;margin-bottom:.875rem">';
    if (ts.duration_min_days) tsInner += mt(ts.duration_min_days+' dias','Duração mínima','blue');
    if (ts.min_budget_per_adset_brl) tsInner += mt('R$ '+ts.min_budget_per_adset_brl+'/dia','Budget min/adset','blue');
    tsInner += '</div>';
    tsInner += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:.75rem">';
    if (ts.kpis_kill_criteria?.length) {
      tsInner += '<div style="background:var(--bg-elevated);border:1px solid var(--danger);border-radius:8px;padding:.75rem .875rem">'
        +'<div style="font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--danger);margin-bottom:.5rem">Critérios de pausa</div>'
        +'<ul style="margin:0;padding-left:1.125rem;font-size:.8125rem;line-height:1.55;color:var(--text-secondary)">'
        + ts.kpis_kill_criteria.map(k=>'<li>'+E(k)+'</li>').join('')
        +'</ul></div>';
    }
    if (ts.kpis_winners?.length) {
      tsInner += '<div style="background:var(--bg-elevated);border:1px solid var(--success);border-radius:8px;padding:.75rem .875rem">'
        +'<div style="font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--success);margin-bottom:.5rem">Critérios de winner</div>'
        +'<ul style="margin:0;padding-left:1.125rem;font-size:.8125rem;line-height:1.55;color:var(--text-secondary)">'
        + ts.kpis_winners.map(k=>'<li>'+E(k)+'</li>').join('')
        +'</ul></div>';
    }
    tsInner += '</div>';
    h += sc('Estratégia de Teste', tsInner);
  }

  if (d.copy_rules_applied?.length) {
    h += sc('Regras de Copy Aplicadas', '<ul class="cl">'+d.copy_rules_applied.map(r=>'<li><span class="cl__icon cl__icon--done">&#10003;</span><span>'+E(r)+'</span></li>').join('')+'</ul>');
  }
  return h;
},

'ee-s3-criativos-anuncios'(d) {
  let h = renderLeituraEstrategica(d, { verdictLabel: 'Veredito dos Criativos' });
  if (d.total_pieces) h += '<div class="gr gr--2">'+mt(d.total_pieces,'Peças no Pack','red')+mt((d.variations||[]).length,'Variações de Hook','')+'</div>';
  if (d.variations?.length) {
    const hk = {dor:'danger',resultado:'green',curiosidade:'yellow',social_proof:'green',urgencia:'red'};
    // Donut de hooks
    const hookCount = {};
    d.variations.forEach(v=>{ hookCount[v.hook_type] = (hookCount[v.hook_type]||0)+1; });
    const hookLabel = {dor:'Dor',resultado:'Resultado',curiosidade:'Curiosidade',social_proof:'Prova Social',urgencia:'Urgência'};
    const hookToneMap = {dor:'red',resultado:'green',curiosidade:'yellow',social_proof:'blue',urgencia:'red'};
    const hookData = Object.keys(hookCount).map(k=>({
      label: hookLabel[k]||k, value: hookCount[k], tone: hookToneMap[k]||'gray',
    }));
    if (hookData.length >= 2) {
      const top = [...hookData].sort((a,b)=>b.value-a.value)[0];
      const hookInsight = 'Hook dominante: "'+top.label+'" ('+top.value+' criativos). '
        +(top.value > d.variations.length * 0.6 ? 'Concentração alta — diversificar ângulos para mitigar fadiga criativa.' : 'Diversidade de ângulos saudável para teste A/B.');
      h += sc('Diversidade de Hooks',
        insight(chartDonut(hookData, {title:'Hooks do Pack'}),
          hookInsight, top.value > d.variations.length * 0.6 ? 'warn' : 'good'));
    }
    h += sc('Variações', d.variations.map(v=>
      '<div class="cd cd--'+(hk[v.hook_type]||'red')+'"><div class="cd__title">'+tg(v.hook_type,hk[v.hook_type])+' '+E(v.hook_text)+'</div>'
      +'<div class="cd__body"><p>'+E(v.short_copy)+'</p>'
      +'<div style="margin-top:.375rem"><strong>Headline:</strong> '+E(v.headline)+' | <strong>CTA:</strong> '+E(v.button_cta)+'</div>'
      +'<div class="cd__meta">Formato: '+E(v.recommended_format)+'</div></div></div>'
    ).join(''));
  }
  if (d.produced_creatives) {
    const pc = d.produced_creatives;
    const hk2 = {dor:'danger',resultado:'green',curiosidade:'yellow',social_proof:'green',urgencia:'red'};
    const hkLbl = {dor:'Dor',resultado:'Resultado',curiosidade:'Curiosidade',social_proof:'Prova Social',urgencia:'Urgência'};
    const cCard = (c, ar) => '<div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;overflow:hidden;display:flex;flex-direction:column">'
      +'<div style="aspect-ratio:'+ar+';background:#FBF4E4 url(\''+E(c.url)+'\') center/cover no-repeat"></div>'
      +'<div style="padding:.5rem .625rem;display:flex;flex-direction:column;gap:.25rem">'
      +'<div style="display:flex;align-items:center;gap:.375rem"><span style="font-size:.625rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em">'+E(c.id)+'</span>'+(c.linked_variation?tg(hkLbl[c.linked_variation]||c.linked_variation, hk2[c.linked_variation]||'gray'):'')+'</div>'
      +(c.caption_label?'<div style="font-size:.75rem;color:var(--text-primary);line-height:1.35">'+E(c.caption_label)+'</div>':'')
      +(c.use_with_copy?'<div style="font-size:.6875rem;color:var(--text-muted);line-height:1.4">'+E(c.use_with_copy)+'</div>':'')
      +'<a href="'+E(c.url)+'" download target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:.25rem;font-size:.6875rem;color:var(--accent);text-decoration:none;font-weight:600;margin-top:.125rem">&#x2B07; Baixar PNG</a>'
      +'</div></div>';
    const cLabel = t => '<div style="font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);margin:.5rem 0">'+E(t)+'</div>';
    let inner = '';
    if (pc.summary) inner += '<p style="margin:0 0 .75rem;color:var(--text-secondary);font-size:.875rem;line-height:1.5">'+E(pc.summary)+'</p>';
    if (pc.feed_instagram?.length) inner += cLabel('Feed Instagram · 4:5 · 1080×1350')+'<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.75rem;margin-bottom:1rem">'+pc.feed_instagram.map(c=>cCard(c,'4/5')).join('')+'</div>';
    if (pc.stories_instagram?.length) inner += cLabel('Stories Instagram · 9:16 · 1080×1920')+'<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.75rem">'+pc.stories_instagram.map(c=>cCard(c,'9/16')).join('')+'</div>';
    h += sc('Criativos Produzidos', inner);
  }
  if (d.ab_test_guide) {
    const g = d.ab_test_guide;
    h += sc('Guia de Teste A/B', '<p><strong>Duração:</strong> '+E(g.test_duration)+'</p>'
      +'<p><strong>Corte:</strong> '+E(g.cut_criteria)+'</p>'
      +(g.combinations?.length?'<p><strong>Combinações:</strong> '+g.combinations.map(c=>E(c)).join(', ')+'</p>':''));
  }
  return h;
},

'ee-s3-crm-setup'(d) {
  let h = renderLeituraEstrategica(d, { verdictLabel: 'Veredito do CRM' });
  if (d.pipeline_stages?.length) {
    // Funnel simulado para representar progressão
    const simStages = d.pipeline_stages.map((s,i)=>({
      name: s.name, volume: Math.round(100 * Math.pow(0.65, i)),
    }));
    const pipeInsight = 'Pipeline de '+d.pipeline_stages.length+' etapas. '
      +'Assumindo taxa média de 65% entre estágios, '+Math.round(100*Math.pow(0.65,d.pipeline_stages.length-1))+'% dos leads chegam ao fim do funil.';
    h += sc('Pipeline de Vendas',
      insight(chartFunnel(simStages, {title:'Estágios (simulação de retenção)', fmt:v=>v+'%'}),
        pipeInsight, 'info')
      +'<div style="display:flex;gap:.375rem;flex-wrap:wrap;margin-bottom:1rem">'
      +d.pipeline_stages.map(s=>
        '<div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);padding:.625rem .875rem;flex:1;min-width:120px;text-align:center">'
        +'<div style="font-size:.625rem;color:var(--accent);font-weight:700">'+E(s.order)+'</div>'
        +'<div style="font-size:.875rem;font-weight:600;color:var(--text-primary)">'+E(s.name)+'</div>'
        +'<div style="font-size:.75rem;color:var(--text-muted)">'+E(s.description)+'</div></div>'
      ).join('<span style="color:var(--text-faint);align-self:center">→</span>')
      +'</div>');
  }
  if (d.welcome_sequence?.length) {
    h += sc('Régua de Boas-Vindas', d.welcome_sequence.map(m=>
      '<div class="chat__msg chat__msg--sdr" style="align-self:flex-start;max-width:100%;margin-bottom:.5rem">'
      +'<div class="chat__who chat__who--sdr">Msg '+E(m.order)+' — '+E(m.timing)+' ('+E(m.channel)+')</div>'
      +E(m.message)+'</div>'
    ).join(''));
  }
  if (d.test_checklist?.length) {
    h += sc('Checklist de Testes', checklist(d.test_checklist, 'passed'));
  }
  return h;
},

'ee-s3-forecast-midia'(d) {
  let h = renderLeituraEstrategica(d, { verdictLabel: 'Veredito do Forecast' });

  // === Distribuição por canal (channel_split) ===
  if (d.channel_split?.channels?.length) {
    const cs = d.channel_split;
    // Donut: label inclui R$/mês para legenda mostrar nome + R$ + %
    const channelData = cs.channels.map((c,i)=>({
      label: E(c.channel)+' · '+BRL(c.monthly_value)+'/mês',
      value: c.percentage,
      tone: c.channel.toLowerCase().includes('google') ? 'blue' : c.channel.toLowerCase().includes('meta') ? 'red' : ['blue','red','green','yellow'][i%4],
    }));
    const insightTxt = (cs.rationale||'').slice(0,300);
    // Cards: cada canal num bloco fechado (não usar mt() solto para evitar desalinhamento do grid)
    const cardHTML = cs.channels.map(c=>{
      const tone = c.channel.toLowerCase().includes('google') ? 'blue' : 'red';
      const col = 'var(--'+(tone==='blue'?'accent':'danger')+', '+(tone==='blue'?'#3b82f6':'#ef4444')+')';
      return '<div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:1rem;display:flex;flex-direction:column;gap:.5rem">'
        +'<div style="display:flex;align-items:baseline;justify-content:space-between;gap:.5rem">'
          +'<div style="font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted)">'+E(c.channel)+'</div>'
          +'<div style="font-size:1.5rem;font-weight:700;color:'+col+'">'+PCT(c.percentage)+'</div>'
        +'</div>'
        +'<div style="font-size:1.125rem;font-weight:700;color:var(--text-primary)">'+BRL(c.monthly_value)+'<span style="font-size:.75rem;color:var(--text-muted);font-weight:500"> /mês</span></div>'
        +(c.primary_intent?'<div style="font-size:.75rem;color:var(--text-secondary);line-height:1.45;border-top:1px solid var(--border);padding-top:.5rem">'+E(c.primary_intent)+'</div>':'')
      +'</div>';
    }).join('');
    h += sc('Distribuição por Canal — '+BRL(cs.total_monthly_budget)+'/mês',
      insight(chartDonut(channelData, {title:'% do Budget'}), insightTxt, 'good')
      +'<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:.75rem;margin-top:.5rem">'+cardHTML+'</div>');
  }

  // === Campanhas por canal ===
  if (d.campaigns) {
    const renderCampaignTable = (channelKey, channelLabel, tone) => {
      const ch = d.campaigns[channelKey];
      if (!ch?.campaigns?.length) return '';
      const rows = ch.campaigns.map(c=>[
        '<strong>'+E(c.name)+'</strong>'+(c.type?'<div style="font-size:.6875rem;color:var(--text-muted)">'+E(c.type)+'</div>':''),
        E(c.objective||'—'),
        BRL(c.monthly_budget),
        c.pct_of_channel!=null?PCT(c.pct_of_channel):'—',
        E((c.purpose||c.audience||c.keyword_cluster||'').slice(0,180))
      ]);
      return sc('Campanhas — '+channelLabel+' (R$ '+N(ch.monthly_budget)+'/mês)',
        tb(['Campanha','Objetivo','Budget','% Canal','Propósito'], rows));
    };
    h += renderCampaignTable('google_ads', 'Google Ads', 'blue');
    h += renderCampaignTable('meta_ads', 'Meta Ads', 'red');
  }

  // === Forecast 6 meses (gráfico ÚNICO + tabela horizontal: KPIs em linhas, meses em colunas) ===
  if (d.forecast_6_months?.monthly_evolution?.length) {
    const fm = d.forecast_6_months;
    const evo = fm.monthly_evolution;
    const monthCols = evo.map(m=>m.label?String(m.label).split(/[—\-]/)[0].trim():'M'+m.month);

    const first = evo[0], last = evo[evo.length-1];
    const leadsGrowth = first?.leads ? ((last.leads-first.leads)/first.leads*100) : 0;
    const cplDrop = first?.cpl ? ((first.cpl-last.cpl)/first.cpl*100) : 0;
    const insightTxt = 'Curva conservadora em 6 meses: leads '+first.leads+' → '+last.leads+' (+'+leadsGrowth.toFixed(0)+'%), CPL R$ '+first.cpl+' → R$ '+last.cpl+' (-'+cplDrop.toFixed(0)+'%), atendimentos '+first.served_clients+' → '+last.served_clients+'/mês. CAC mídia sai de R$ '+first.cac_media+' (mês 1 — ramp-up) para R$ '+last.cac_media+' (mês 6). MQL Rate '+first.mql_rate_pct+'% → '+last.mql_rate_pct+'%.';

    // Gráfico ÚNICO com volumes do funil + custos. width=1000 para ocupar toda largura disponível.
    h += sc('Forecast 6 Meses — Evolução Conservadora',
      insight(chartGroupedBars(monthCols, [
        {name:'Leads',           tone:'blue',   values:evo.map(m=>m.leads||0)},
        {name:'MQLs',            tone:'yellow', values:evo.map(m=>m.mqls||0)},
        {name:'Agendamentos',    tone:'green',  values:evo.map(m=>m.appointments||0)},
        {name:'Atendimentos',    tone:'orange', values:evo.map(m=>m.served_clients||0)},
        {name:'CPL (R$)',        tone:'red',    values:evo.map(m=>Math.round(m.cpl||0))},
        {name:'CAC mídia (R$)',  tone:'gray',   values:evo.map(m=>m.cac_media||0)},
      ], {title:'Funil + Custos Mês a Mês', width:1000, height:300}),
      insightTxt, 'good')

      // Tabela HORIZONTAL: KPIs nas linhas, meses nas colunas. Headers: strings simples (tb() escapa HTML).
      // Linha "Fase" entra como primeira linha de dados, com HTML pre-formatado.
      + (function(){
        const monthHeaders = evo.map(m=>m.label||('M'+m.month));
        const phaseRow = ['<strong>Fase</strong>',
          ...evo.map(m=>'<span style="font-size:.75rem;color:var(--text-secondary);line-height:1.35">'+E(m.phase||'')+'</span>')];
        const rows = [
          phaseRow,
          ['Impressões',     ...evo.map(m=>N(m.impressions))],
          ['Cliques',        ...evo.map(m=>N(m.clicks))],
          ['CTR',            ...evo.map(m=>PCT(m.ctr_pct))],
          ['CPC',            ...evo.map(m=>BRL(m.cpc))],
          ['<strong>Leads</strong>',         ...evo.map(m=>'<strong>'+N(m.leads)+'</strong>')],
          ['CPL',            ...evo.map(m=>BRL(m.cpl))],
          ['MQL Rate',       ...evo.map(m=>PCT(m.mql_rate_pct))],
          ['MQLs',           ...evo.map(m=>N(m.mqls))],
          ['Agendamentos',   ...evo.map(m=>N(m.appointments))],
          ['Show Rate',      ...evo.map(m=>PCT(m.show_rate_pct))],
          ['<strong>Atendimentos</strong>',  ...evo.map(m=>'<strong>'+N(m.served_clients)+'</strong>')],
          ['CAC mídia',      ...evo.map(m=>BRL(m.cac_media))]
        ];
        return tb(['KPI', ...monthHeaders], rows);
      })()
    );

    if (fm.totals_6_months) {
      const t = fm.totals_6_months;
      h += sc('Acumulado 6 Meses (Cenário Conservador)', '<div class="gr gr--4">'
        +mt(N(t.total_leads),'Total leads','blue')
        +mt(N(t.total_mqls),'Total MQLs','yellow')
        +mt(N(t.total_appointments),'Total agendamentos','green')
        +mt(N(t.total_served_clients),'Total atendimentos','orange')
        +'</div>'
        +'<div class="gr gr--4" style="margin-top:.75rem">'
        +mt(BRL(t.total_investment),'Investimento total','gray')
        +mt(BRL(t.avg_cpl),'CPL médio','red')
        +mt(PCT(t.avg_mql_rate_pct),'MQL Rate médio','yellow')
        +mt(BRL(t.avg_cac_media),'CAC mídia médio','gray')
        +'</div>');
    }
    if (fm.evolution_logic) {
      h += sc('Lógica de Evolução', co(fm.evolution_logic));
    }
  }

  // === 12 KPIs operacionais ===
  if (d.tracking_metrics?.metrics?.length) {
    const tm = d.tracking_metrics;
    h += sc('Métricas de Acompanhamento — 12 KPIs',
      (tm.description?'<p style="margin:0 0 .75rem;color:var(--text-secondary);font-size:.875rem;line-height:1.5">'+E(tm.description)+'</p>':'')
      + tb(['#','Métrica','Definição','Fonte','Frequência','Benchmark / Baseline'],
        tm.metrics.map(m=>[
          '<strong>'+E(m.id)+'</strong>',
          '<strong>'+E(m.metric)+'</strong>',
          E(m.definition),
          E(m.source),
          tg(m.frequency, m.frequency==='diária'?'red':m.frequency==='semanal'?'yellow':'gray'),
          E(m.benchmark_pet_vet || m.baseline || '—')
        ])));
  }

  // === Premissas e dependências ===
  if (d.assumptions_and_dependencies?.length) {
    h += sc('Premissas e Dependências', '<ul class="cl">'
      +d.assumptions_and_dependencies.map(x=>'<li><span class="cl__icon cl__icon--pending">&#9888;</span><span>'+E(x)+'</span></li>').join('')
      +'</ul>');
  }

  // === Backward-compat: campos antigos do schema v1 ===
  if (d.financial_model?.length) {
    const months = d.financial_model.map(m=>m.label||m.month);
    const leadsVals = d.financial_model.map(m=>m.leads||0);
    const revVals = d.financial_model.map(m=>Math.round((m.revenue||0)/1000));
    const roasVals = d.financial_model.map(m=>(m.roas||0)*10);
    const first = d.financial_model[0];
    const last = d.financial_model[d.financial_model.length-1];
    const growth = first && last && first.revenue ? ((last.revenue-first.revenue)/first.revenue*100) : 0;
    const modelInsight = first && last
      ? 'Progressão: receita sai de '+BRL(first.revenue||0)+' (mês 1) para '+BRL(last.revenue||0)+' (mês '+last.month+') — crescimento de '+growth.toFixed(0)+'%. ROAS final: '+(last.roas||'?')+'x.'
      : '';
    h += sc('Modelagem Financeira',
      insight(chartGroupedBars(months,
        [
          {name:'Leads', tone:'blue', values:leadsVals},
          {name:'Receita (k R$)', tone:'green', values:revVals},
          {name:'ROAS × 10', tone:'yellow', values:roasVals},
        ],
        {title:'Evolução Mês a Mês', height:220}),
        modelInsight, growth>=50?'good':growth>=20?'warn':'bad')
      +tb(['Mês','Label','Budget','CPL','Leads','Conv.','Vendas','Receita','ROAS'],
      d.financial_model.map(m=>[E(m.month),E(m.label),BRL(m.budget),BRL(m.cpl),E(m.leads),PCT(m.conversion_rate),E(m.sales),BRL(m.revenue),'<strong>'+N(m.roas)+'x</strong>'])));
  }
  if (d.platform_distribution?.length) {
    const platData = d.platform_distribution.map((p,i)=>({
      label: p.platform, value: p.percentage,
      tone: ['blue','red','green','yellow'][i%4],
    }));
    h += sc('Distribuição por Plataforma',
      chartDonut(platData, {title:'% do Budget'})
      +'<div class="gr gr--'+Math.min(4,d.platform_distribution.length)+'">'
      +d.platform_distribution.map(p=>mt(PCT(p.percentage),E(p.platform),'red')+'<div style="text-align:center;font-size:.75rem;color:var(--text-muted)">'+BRL(p.monthly_value)+'/mês</div>').join('')+'</div>');
  }
  if (d.alerts?.length) {

      d.alerts.map(a=>[E(a.metric),tg(a.threshold,'danger'),E(a.action)])));

},

    }).join('')+'</div>'

  }

    h += sc('Serviços', tb(['Serviço','Descrição','Preço'],
      d.services.map(s=>[E(s.name),E(s.description),E(s.price||'—')])));
  }
  if (d.posts?.length) {
    const typeColor = {novidade:'blue',oferta:'green',evento:'yellow'};
    const typeLbl = {novidade:'Novidade',oferta:'Oferta',evento:'Evento'};

      const txt = p.text || '';

        +'<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem;margin-bottom:.375rem;flex-wrap:wrap">'
          +'<div style="font-weight:600;color:var(--text-primary);font-size:.9375rem;line-height:1.35;flex:1;min-width:200px">'+E(p.title)+'</div>'
          +'<div style="display:flex;gap:.375rem;flex-shrink:0;align-items:center">'
            +tg(typeLbl[t]||t, typeColor[t]||'gray')
            +'<span style="font-size:.625rem;color:var(--text-muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase">Semana '+(i+1)+'</span>'
          +'</div>'
        +'</div>'
        +'<p style="margin:.375rem 0;font-size:.8125rem;line-height:1.55;color:var(--text-secondary)">'+E(truncated)+'</p>'

          +(p.cta?'<div style="display:flex;align-items:center;gap:.375rem"><span style="font-size:.625rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700">CTA do botão</span><span style="background:'+TURQ_LOCAL+';color:#fff;border-radius:4px;padding:.1875rem .5rem;font-size:.75rem;font-weight:600">'+E(p.cta)+'</span></div>':'<span></span>')
          +'<span style="font-size:.625rem;color:var(--text-muted)">'+txt.length+' / 1.500 chars</span>'
        +'</div>'
      +'</div>';
    }).join('');
    h += sc('Posts (30 dias)', postsHtml);
  }
  if (d.qas?.length) {
    h += sc('Perguntas e Respostas', d.qas.map(q=>cd(q.question,E(q.answer))).join(''));
  }
  if (d.implementation_checklist?.length) {
    const slug = (window.PORTAL_DATA && PORTAL_DATA.client && PORTAL_DATA.client.slug) || 'cliente';
    const storageKey = 'gmb-checklist:'+slug;
    const items = d.implementation_checklist;
    const total = items.length;
    const id = 'gmbck-'+Math.random().toString(36).slice(2,8);

    // Handlers globais — definidos uma vez, persistem
    window.gmbCk = window.gmbCk || function(key, idx, el, id, total) {
      let s = {}; try { s = JSON.parse(localStorage.getItem(key) || '{}'); } catch(e) {}
      s[idx] = el.checked;
      localStorage.setItem(key, JSON.stringify(s));
      const all = document.querySelectorAll('[data-ck="'+id+'"]');
      let done = 0; all.forEach(c => { if (c.checked) done++; });
      const bar = document.getElementById(id+'-bar');
      const cnt = document.getElementById(id+'-count');
      if (bar) bar.style.width = (done/total*100) + '%';
      if (cnt) cnt.textContent = done + ' / ' + total;
    };
    window.gmbCkReset = window.gmbCkReset || function(key, id, total) {
      if (!confirm('Limpar todos os marcadores deste checklist?')) return;
      localStorage.removeItem(key);
      const all = document.querySelectorAll('[data-ck="'+id+'"]');
      all.forEach(c => { if (!c.disabled) c.checked = false; });
      const bar = document.getElementById(id+'-bar');
      const cnt = document.getElementById(id+'-count');
      if (bar) bar.style.width = '0%';
      if (cnt) cnt.textContent = '0 / ' + total;
    };
    window.gmbCkInit = window.gmbCkInit || function(key, id, total) {
      let s = {}; try { s = JSON.parse(localStorage.getItem(key) || '{}'); } catch(e) {}
      const all = document.querySelectorAll('[data-ck="'+id+'"]');
      let done = 0;
      all.forEach(c => {
        const idx = c.dataset.idx;
        if (s[idx] != null) c.checked = !!s[idx];
        if (c.checked) done++;
      });
      const bar = document.getElementById(id+'-bar');
      const cnt = document.getElementById(id+'-count');
      if (bar) bar.style.width = (done/total*100) + '%';
      if (cnt) cnt.textContent = done + ' / ' + total;
    };

    const blockedCount = items.filter(it=>it.status==='blocked').length;
    const itemsHtml = items.map((it,i)=>{
      const baseDone = it.status === 'done';
      const blocked = it.status === 'blocked';
      const itemId = id+'-'+i;
      const onchange = blocked ? '' : ' onchange="window.gmbCk(\''+storageKey+'\','+i+',this,\''+id+'\','+total+')"';
      return '<li style="display:flex;align-items:flex-start;gap:.625rem;padding:.625rem .75rem;border-bottom:1px solid var(--border);transition:background .15s"'+(blocked?' style="opacity:.6"':'')+'>'
        +'<input type="checkbox" id="'+itemId+'" data-ck="'+id+'" data-idx="'+i+'"'+(baseDone?' checked':'')+(blocked?' disabled':'')+onchange+' style="margin-top:.1875rem;width:16px;height:16px;cursor:'+(blocked?'not-allowed':'pointer')+';accent-color:'+TURQ_LOCAL+';flex-shrink:0">'
        +'<label for="'+itemId+'" style="flex:1;cursor:'+(blocked?'not-allowed':'pointer')+';font-size:.8125rem;line-height:1.5;color:var(--text-primary);user-select:none">'
          +'<div style="display:flex;align-items:center;gap:.5rem;flex-wrap:wrap"><span>'+E(it.item)+'</span>'
          +(blocked?tg('Bloqueado','red'):'')+'</div>'
          +(it.notes?'<div style="font-size:.6875rem;color:var(--text-muted);margin-top:.25rem;font-style:italic">'+E(it.notes)+'</div>':'')
        +'</label>'
      +'</li>';
    }).join('');

    const inner = '<div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:.75rem 1rem;margin-bottom:.75rem;display:flex;align-items:center;gap:.875rem;flex-wrap:wrap">'
      +'<div style="font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);white-space:nowrap">Progresso</div>'
      +'<div style="flex:1;min-width:140px;height:8px;background:var(--border);border-radius:4px;overflow:hidden;position:relative"><div id="'+id+'-bar" style="height:100%;background:'+TURQ_LOCAL+';width:0%;transition:width .25s ease"></div></div>'
      +'<div id="'+id+'-count" style="font-size:.8125rem;font-weight:700;color:var(--text-primary);white-space:nowrap;font-variant-numeric:tabular-nums">0 / '+total+'</div>'
      +(blockedCount?'<span style="font-size:.6875rem;color:var(--text-muted)">('+blockedCount+' bloqueado'+(blockedCount>1?'s':'')+')</span>':'')
      +'<button onclick="window.gmbCkReset(\''+storageKey+'\',\''+id+'\','+total+')" style="background:transparent;border:1px solid var(--border);color:var(--text-muted);font-size:.625rem;padding:.25rem .625rem;border-radius:4px;cursor:pointer;text-transform:uppercase;letter-spacing:.05em;font-weight:600">Limpar</button>'
      +'</div>'
      +'<ul style="list-style:none;padding:0;margin:0;background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;overflow:hidden">'+itemsHtml+'</ul>'
      +'<img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" style="display:none" onload="setTimeout(function(){window.gmbCkInit(\''+storageKey+'\',\''+id+'\','+total+')},10)" onerror="setTimeout(function(){window.gmbCkInit(\''+storageKey+'\',\''+id+'\','+total+')},10)">';
    h += sc('Checklist de Implementação', inner);
  }
  return h;
},

'ee-s4-diagnostico-comercial'(d) {
  let h = renderLeituraEstrategica(d, { verdictLabel: 'Veredito Comercial' });
  if (d.funnel_diagnosis?.length) {
    let funnelChart;
    let funnelInsight;
    if (d.funnel_extended?.length) {
      funnelChart = chartChevronFunnel(d.funnel_extended);
      const constraint = d.funnel_extended.find(s=>s.is_active_constraint);
      funnelInsight = constraint
        ? 'Restrição ativa: "'+constraint.stage+'" — '+(constraint.subtext||'').substring(0,160)
        : '';
    } else {
      let simVol = 100;
      const funnelStages = d.funnel_diagnosis.map((f,i)=>{
        const stage = {name: f.stage, volume: Math.round(simVol), highlight: f.status==='critical'||f.status==='low'};
        if (f.current_rate!=null) simVol = simVol * f.current_rate;
        return stage;
      });
      funnelChart = chartFunnel(funnelStages, {title:'Afunilamento (% retenção)', fmt:v=>v+'%'});
      const worst = [...d.funnel_diagnosis].filter(f=>f.gap!=null).sort((a,b)=>a.gap-b.gap)[0];
      funnelInsight = worst
        ? 'Maior gargalo: "'+worst.stage+'" com gap de '+worst.gap.toFixed(1)+'pp vs benchmark. '+(worst.bottleneck||'').substring(0,100)
        : '';
    }
    const worstGap = [...d.funnel_diagnosis].filter(f=>f.gap!=null).sort((a,b)=>a.gap-b.gap)[0];
    const insightTone = worstGap && worstGap.gap<-10 ? 'bad' : worstGap && worstGap.gap<0 ? 'warn' : 'good';
    h += sc('Funil de Vendas',
      insight(funnelChart, funnelInsight, insightTone)
      +tb(['Etapa','Taxa Atual','Benchmark','Gap','Status','Gargalo'],
      d.funnel_diagnosis.map(f=>[E(f.stage),PCT(f.current_rate),PCT(f.benchmark),
        '<span style="color:var(--'+(f.gap>=0?'success':'danger')+')">'+((f.gap>=0?'+':'')+N(f.gap))+'pp</span>',
        tg(BENCH_LBL[f.status]||CLS[f.status]||f.status, BENCH_CLR[f.status]||CLC[f.status]),E(f.bottleneck)])));
  }
  if (d.primary_bottleneck) {
    h += cd('Gargalo Principal','<strong>'+E(d.primary_bottleneck.stage)+':</strong> '+E(d.primary_bottleneck.description)
      +'<div class="cd__meta">'+E(d.primary_bottleneck.estimated_improvement)+'</div>','danger');
  }
  if (d.objection_map?.length) {
    const objTypeColor = {price:'red',urgency:'yellow',authority:'gray',trust:'yellow',need:'red',competitor:'yellow'};
    h += sc('Mapa de Objeções', d.objection_map.map(o=>
      cd(o.objection,
        '<div style="margin-bottom:.5rem">'+tg(o.type, objTypeColor[o.type])+'</div>'
        +'<strong>Resposta:</strong> '+E(o.recommended_response)+'<br><strong>Prevenção SDR:</strong> '+E(o.sdr_prevention))
    ).join(''));
  }
  if (d.qualification_criteria) {
    const qc = d.qualification_criteria;
    const renderStar = (label, data, color) => data ? cd(label,
      E(data.profile)+(data.mandatory_signals||data.signals?'<ul style="margin:.5rem 0 0;padding-left:1rem">'
      +(data.mandatory_signals||data.signals||[]).map(s=>'<li style="font-size:.8125rem">'+E(s)+'</li>').join('')+'</ul>':'')
      +'<div class="cd__meta">Ação: '+E(data.action)+'</div>',color) : '';
    h += sc('Critérios de Qualificação', renderStar('5 Estrelas',qc.five_star,'green')
      +renderStar('4 Estrelas',qc.four_star,'green')+renderStar('3 Estrelas',qc.three_star,'yellow')
      +renderStar('1-2 Estrelas',qc.one_two_star,'danger'));
  }
  return h;
},

'ee-s4-cliente-oculto'(d) {
  let h = renderLeituraEstrategica(d, { verdictLabel: 'Veredito do Cliente Oculto' });
  if (d.evaluation?.overall_score != null) {
    const s = d.evaluation.overall_score;
    h += '<div class="gr gr--3">'
      +mt(s.toFixed(1)+'/10','Nota Geral',s>=7?'green':s>=4?'yellow':'red')
      +mt(CLS[d.evaluation.classification]||d.evaluation.classification||'—','Classificação','')
      +(d.simulation_metadata?.total_duration_minutes?mt(d.simulation_metadata.total_duration_minutes+'min','Duração',''):'')
      +'</div>';
    // Gauge da nota geral vs benchmark 7/10
    const ocTone = s>=7?'good':s>=4?'warn':'bad';
    const ocInsight = 'Nota '+s.toFixed(1)+'/10. '
      +(s>=7?'Atendimento saudável — refinar scripts para escalar consistência.'
        :s>=4?'Atendimento inconsistente — gaps em qualificação e follow-up custam conversão.'
        :'CRÍTICO: prejuízo direto em conversão. Intervenção de processo imediata.');
    h += insight(chartGauge(s, 7, 10, {title:'Nota do Atendimento', fmt:v=>v.toFixed(1)+'/10'}), ocInsight, ocTone);
  }
  if (d.buyer_profile) {
    const b = d.buyer_profile;
    h += sc('Perfil do Comprador', cd(b.name,
      '<strong>Situação:</strong> '+E(b.situation)+'<br>'
      +'<strong>Urgência:</strong> '+tg(b.urgency,{high:'red',medium:'yellow',low:'green'}[b.urgency])+' '
      +'<strong>Objeção:</strong> '+E(b.main_objection),'red'));
  }
  if (d.evaluation?.criteria_scores?.length) {
    const critBars = d.evaluation.criteria_scores.map(c=>({
      label: c.criterion,
      value: c.score,
      tone: c.score>=7?'green':c.score>=4?'yellow':'red',
    }));
    const critInsight = (() => {
      const weakest = [...critBars].sort((a,b)=>a.value-b.value)[0];
      const avg = critBars.reduce((s,x)=>s+x.value,0)/critBars.length;
      return weakest
        ? 'Critério mais fraco: "'+weakest.label+'" ('+weakest.value+'/10). Média geral: '+avg.toFixed(1)+'/10 — focar aqui primeiro para puxar a nota geral.'
        : '';
    })();
    h += sc('Scores por Critério',
      insight(chartHBar(critBars, {title:'Avaliação por Dimensão', fmt:v=>v+'/10', labelWidth:160}),
        critInsight, critBars.some(x=>x.value<4)?'bad':critBars.some(x=>x.value<7)?'warn':'good')
      +'<div class="gr gr--2">'+d.evaluation.criteria_scores.map(c=>
        '<div class="cd"><div class="cd__title">'+E(c.criterion)+' <span style="color:var(--'+(c.score>=7?'success':c.score>=4?'warning':'danger')+')">'+c.score+'/10</span></div>'
        +'<div class="cd__body">'+E(c.observation)+'</div></div>'
      ).join('')+'</div>');
  }
  if (d.evaluation?.strengths?.length || d.evaluation?.critical_improvements?.length) {
    h += sc('Pontos Fortes & Melhorias', '<div class="gr gr--2">'
      +cd('Pontos Fortes',(d.evaluation.strengths||[]).map(s=>'<div style="margin-bottom:.25rem;color:var(--success)">&#10003; '+E(s)+'</div>').join(''),'green')
      +cd('Melhorias Críticas',(d.evaluation.critical_improvements||[]).map(s=>'<div style="margin-bottom:.25rem;color:var(--danger)">&#10007; '+E(s)+'</div>').join(''),'danger')
      +'</div>');
  }
  if (d.evaluation?.sdr_impact_per_improvement?.length) {
    h += sc('Impacto do SDR IA', tb(['Melhoria','Solução SDR','Impacto'],
      d.evaluation.sdr_impact_per_improvement.map(i=>[E(i.improvement),E(i.sdr_solution),tg(i.estimated_impact,'green')])));
  }
  return h;
},

'ee-revisao-semanal'(d) {

  // Header da revisão

  if (d.evolucao_estrategica?.length) {

        ev.tema || '—',
        (ev.id ? '<div style="margin-bottom:.5rem">'+tg(ev.id, 'red')+'</div>' : '')

        + (ev.impacto_estrategico ? '<p style="font-size:.75rem;margin:.5rem 0;color:var(--accent)"><strong>Impacto:</strong> '+E(ev.impacto_estrategico)+'</p>' : '')
        + (ev.narrativa_sugerida ? '<details style="margin-top:.375rem"><summary style="cursor:pointer;font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted)">Narrativa sugerida</summary><p style="font-size:.75rem;margin:.375rem 0;color:var(--text-secondary)">'+E(ev.narrativa_sugerida)+'</p></details>' : '')

    ).join(''));
